# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  breadcrumb:
    label: 面包屑返回文案
    fields:
      text: 返回文案
  banner:
    label: 页面顶部 banner 标题
    fields:
      title: banner 标题
  process:
    label: 测评流程板块
    fields:
      title: 板块标题
      steps: 步骤列表（按页面从上到下视觉顺序排列，共 7 步）
      steps[].id: 步骤编号
      steps[].title: 步骤标题
      steps[].text_1: 步骤描述片段 1
      steps[].link_1: "链接 1（URL 或邮箱，组件按步骤位置决定是否加 mailto: 前缀）"
      steps[].link_text: 链接显示文本（仅步骤 5，覆盖 link_1 的默认显示）
      steps[].text_2: 步骤描述片段 2
      steps[].text_3: 步骤描述片段 3
      steps[].link_2: 链接 2（URL 或邮箱）
      steps[].text_lits: 列表项数组（仅步骤 7）
      steps[].text_4: 步骤描述片段 4
