# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  template:
    label: 服务器 OSV 测评模板
    fields:
      title: 板块标题
      lists: 检测项数组
      lists[].name: 检测项名称
      lists[].desc: 检测项描述
      lists[].result: 检测结果
  flushbonading:
    label: 嵌入式 OSV 测评模板
    fields:
      lists: lists
