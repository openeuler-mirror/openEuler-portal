# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  talent_demand:
    label: 人才需求公司列表
    fields:
      logo_light: 亮色 logo
      logo_dark: 公司 logo（PNG，亮色/暗色主题，<img> 消费）
      link: 招聘链接
      company: 公司名称
      intro: 公司介绍
      posts: 岗位列表
