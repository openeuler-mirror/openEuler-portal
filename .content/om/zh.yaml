# 运维专区数据 / OM Zone page data
#
# 仅中文（/zh/om/），无对应 en 页面。
# 图片就近存放在 ./images/，由 OPlusYamlContentVitePlugin 接入 Vite 资源管线输出带 hash 的真实 URL。
# 字段用基线名（snake_case），消费组件通过 #content/om 虚拟模块读取。

# help_contents: 帮助咨询文案（3 条提示文字，页面底部帮助区块）
help_contents:
  - '如有疑问可扫描二维码，我们会有专人为您解答'
  - 'openEuler公众号进入运维专区，点击“加群”，进入技术交流群'
  - 'openEuler小助手，备注“运维”，进入技术交流群'

# qr_codes: 二维码配置（公众号 + 小助手）
#   value: 二维码图片路径（相对当前 yaml 文件）
#   label: 二维码下方标签文字
qr_codes:
  - value: ./images/accounts-QR.png
    label: openEuler公众号
  - value: ./images/helper-QR.png
    label: openEuler小助手

# om_set: 运维全集配置（3 个分组：系统运维 / 故障处理 / 运维支撑）
#   title: 分组标题
#   height: 标题高度（px，用于 inline 样式）
#   card_list: 分组下的卡片列表
#     title: 卡片标题
#     width: 卡片宽度（px）
#     items: 卡片下的条目列表
om_set:
  - title: 系统运维
    height: 122
    card_list:
      - title: 日常维护
        width: 248
        items:
          - 告警管理
          - 补丁升级
          - 系统巡检
          - 安全扫描
          - 日志监控
          - 应急恢复
      - title: 系统管理
        width: 248
        items:
          - 部署迁移
          - 镜像管理
          - 热补丁
          - 备份恢复
          - 预警整改
          - 配置溯源
      - title: 系统优化
        width: 268
        items:
          - 系统调优
          - 业务调优
          - 网络调优
      - title: 自动化
        width: 268
        items:
          - 运维编排
          - 自动部署
          - 自动恢复
  - title: 故障处理
    height: 98
    card_list:
      - title: 工具
        width: 628
        items:
          - 日志收集
          - 远程操作
          - 故障分析
          - 故障诊断
          - 巡检修复
          - 安全加固
          - 告警修复
          - 异常检测
      - title: 数据
        width: 428
        items:
          - 监控大屏
          - 数据报表
          - 智能探针
          - 架构感知
  - title: 运维支撑
    height: 98
    card_list:
      - title: 标准规范
        width: 548
        items:
          - 系统巡检标准
          - 运维流程规范
          - 升级流程规范
          - 安全加固标准
          - 故障处理规范
          - 应急恢复流程
      - title: 维护管理
        width: 316
        items:
          - 权限管理
          - 版本管理
          - 配置管理
          - 变更管理
      - title: 资产管理
        width: 180
        items:
          - 主机管理
          - 知识管理

