# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  help_contents:
    label: 帮助咨询文案
    fields: {}
  qr_codes:
    label: 二维码配置
    fields:
      value: 二维码图片路径（相对当前 yaml 文件）
      label: 二维码下方标签文字
  om_set:
    label: 运维全集配置
    fields:
      title: 分组标题
      height: 标题高度（px，用于 inline 样式）
      card_list: 分组下的卡片列表
      card_list[].title: 卡片标题
      card_list[].width: 卡片宽度（px）
      card_list[].items: 卡片下的条目列表
  features_download_url:
    label: OSMind 关键特性与价值 PDF 下载地址
    fields: {}
  guide_download_url:
    label: OSMind 安装使用手册下载地址
    fields: {}
  tools_url:
    label: ITServiceTools 工具下载链接
    fields:
      base: 基础能力工具列表
      base[].name: 文件名
      base[].url: 下载地址
      feature: 高级运维组件工具列表
      feature[].name: 文件名
      feature[].url: 下载地址
