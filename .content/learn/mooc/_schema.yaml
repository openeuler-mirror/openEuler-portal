# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  mooc_course:
    label: 课程列表
    fields:
      id: 课程 ID
      img: 课程封面图（PNG，<img> 消费）
      title: 课程标题
      desc: 课程描述
      apply_link: 报名链接（可选）
      children: 子链接列表
      children[].name: 链接文案
      children[].path: 链接地址
en:
  mooc_course:
    label: Course list
    fields:
      id: Course ID
      img: Course cover image (PNG, <img>)
      title: Course title
      desc: Course description
      apply_link: Registration link (optional)
      children: Sub-link list
      children[].name: Link text
      children[].path: Link URL
