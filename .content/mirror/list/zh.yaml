# 镜像站列表页数据 / Mirror list page data
#
# 板块按页面从上到下视觉顺序排列。
# 所有数据 zh/en 相同（版本名、地区代码、命令字符串均通用），两个文件内容一致。

# area_arr: 地区筛选选项（MirrorList 筛选区）
#   value: 地区代码
#   label: 地区名称（英文，zh/en 共用）
area_arr:
  - value: AS
    label: Asia
  - value: EU
    label: Europe
  - value: NA
    label: North America

# rsync_code: rsync 同步命令（MirrorList 文本区，zh/en 共用）
rsync_code: 'rsync -av --partial --progress --delete rsync://root@repo.openeuler.openatom.cn/openeuler/***(localDirectory)'

# repo_size: 镜像仓大小列表（MirrorSize 表格）
#   release: 版本名称
#   size: 镜像大小
