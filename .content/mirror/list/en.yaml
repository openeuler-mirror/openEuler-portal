# Mirror list page data
#
# Sections are ordered top-to-bottom by visual position on the page.
# All data is identical for zh/en (version names, region codes, command strings are universal).

# area_arr: Region filter options (MirrorList filter area)
#   value: Region code
#   label: Region name (English, shared zh/en)
area_arr:
  - value: AS
    label: Asia
  - value: EU
    label: Europe
  - value: NA
    label: North America

# rsync_code: rsync sync command (MirrorList text area, shared zh/en)
rsync_code: 'rsync -av --partial --progress --delete rsync://root@repo.openeuler.openatom.cn/openeuler/***(localDirectory)'

# repo_size: Mirror repository size list (MirrorSize table)
#   release: Version name
#   size: Image size
