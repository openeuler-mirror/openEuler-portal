# introduce: Conference intro (description, highlights, slogan)
introduce:
  desc:
    - Over the past six years, openEuler has grown into a leading open source operating system (OS), supporting diversified computing power and powering core applications across industries such as Internet, finance, and carrier.
    - 'Looking ahead, openEuler will continue to uphold the vision of "AI for OS, OS for AI", paving the way for a new era of OS evolution, where AI and OS converge to drive AI computing. '
    - On November 14–15, 2025, the Operating System Conference & openEuler Summit 2025 will take place at the ZhongGuanCun International Innovation Center in Beijing. At the event, openEuler will launch a major AI-driven version, and global partners will unveil flagship products built on openEuler — showcasing shared innovation and confidence in advancing next-gen OS for the intelligent era.
  tips: 'At the event, you will:'
  list:
    - Be the first to witness our next-gen OS and discover what's next in OS evolution.
    - Experience openEuler's partner product releases for the next globalization chapter.
    - Join 30+ keynotes, sessions, and roundtable to exchange ideas with experts and developers worldwide, and hear cutting-edge insights and real-world success stories.
    - Visit the 1,000㎡ exhibition area to explore the latest technological innovations, engage in hands-on activities, and immerse yourself in the collaborative achievements.
  slogan:
    - Let's meet in Beijing — to inspire, collaborate, and co-create the next chapter of the global open source ecosystem.

