    dark: ./images/apply-bar-mb-dark.png
  title: Agentic Infra 操作系统大会 & openEuler Summit 2026
  date_place: 11月13日-14日 | 中国·北京中关村国际创新中心
  button_text: 立即报名

# introduce: 大会简介（描述、亮点列表、口号）
introduce:
  desc:
    - Agentic AI时代加速到来，算力基础设施正经历深刻变革，操作系统迎来全新的发展范式。历经七载深耕，作为中国领先的开源操作系统，openEuler已广泛部署在互联网及国计民生等千行万业，率先发布超节点OS，持续引领数智化创新。面向Agentic AI时代，openEuler将立足打造Agentic Infra坚实底座，携手产业伙伴共赴下一代操作系统的演进之路。
    - 为此，我们诚挚地邀请您出席将于2026年11月13日-14日在北京中关村国际创新中心举办的 <strong>Agentic Infra 操作系统大会 &amp; openEuler Summit 2026</strong>。本次大会以"智启未来，引领 Agentic Infra 创新"为主题，集中展示 openEuler 在超节点 OS 与 Agentic Infra 领域的最新突破，与产业界一起凝聚共识，共同探索 AI 规模化落地所必需的高效、安全底座。
  tips: 我们诚挚地邀请您莅临大会现场，在这里您将可以：
  list:
    - 见证 openEuler 在超节点 OS 上的最新成果发布与 Agentic Infra 的关键技术突破
    - 见证全球伙伴重磅AI产品与方案发布，洞悉操作系统在AI时代的关键角色
    - 参与30+场主题演讲与圆桌论坛，与全球专家、开发者共话Agentic Infra前沿观点与落地实践
    - 走进1000㎡沉浸式交流区，体验最新Agentic AI技术创新并动手实践，感受伙伴AI联创成果的全景演绎
  slogan:
    - 志合者，不以山海为远。我们期待与您相聚北京，共话Agentic AI时代的技术演进之道，携手谱写Agentic Infra的创新篇章！

