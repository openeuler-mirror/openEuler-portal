#   Rows without a speaker keep empty-string placeholders (name/post: "") instead of omitting keys, keeping a consistent row shape (the editor clones new rows from the first one)
#   Sub-forum sessions[]: closed: true is the closed-door state (agenda hidden); when pending_cards is present, placeholder cards are shown instead — remove it once the agenda is confirmed

