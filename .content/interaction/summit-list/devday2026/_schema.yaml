# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  banner:
    label: 顶部 banner 配置
    fields:
      bg: banner 背景图（PC，JPG）
      bg_mb: banner 背景图（移动端，JPG）
      text_img: banner 文字图片（PNG）
      btn: 按钮文案
      href: 按钮链接（观看回放）
  live:
    label: 直播配置
    fields:
      title: 直播标题
      url: 直播链接
