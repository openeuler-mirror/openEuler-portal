# 联系我们中文数据 / Contact Us page data (zh)
#
# 按板块名索引的顶层对象。字段用基线名（无 _zh/_en 后缀）。
# 图片路径以 ./ 开头，由 vite-plugin-content-yaml 重写为 import 走 Vite 资源管线。

# contact_data: 社区联系卡片
#   title: 卡片标题
#   email: 联系邮箱
#   icon: 图标（SVG，带 ?raw 后缀以获取文件内容）
contact_data:
  - title: 资金捐赠请联系
    email: gaofei@openatom.org
    icon: ./images/icon-contact1.svg?raw
  - title: 社区活动请联系
    email: events@openeuler.sh
    icon: ./images/icon-contact2.svg?raw
  - title: 品牌合作请联系
    email: marketing@openeuler.org
    icon: ./images/icon-contact3.svg?raw
  - title: 其他联系方式
    email: dev@openeuler.org
    icon: ./images/icon-contact4.svg?raw

# footer_codes: 公众号 / 小助手二维码
#   code: 二维码图片
#   label: 二维码标题
footer_codes:
  - code: ./images/code-zgz.jpg
    label: 微信公众号
  - code: ./images/code-xzs.png
    label: 小助手

# follow_links: 社交媒体关注链接
#   icon/icon_dark/icon_primary: 亮色/暗色/主色图标
#   href: 链接
#   label: 名称
follow_links:
  - icon: ./images/x_light.png
    icon_dark: ./images/x_dark.png
    icon_primary: ./images/x_primary.png
    href: https://x.com/openeuler
    label: X
  - icon: ./images/linkedin_light.png
    icon_dark: ./images/linkedin_dark.png
    icon_primary: ./images/linkedin_primary.png
    href: https://www.linkedin.com/company/openeuler
    label: LinkedIn
  - icon: ./images/youtube_light.png
    icon_dark: ./images/youtube_dark.png
    icon_primary: ./images/youtube_primary.png
    href: https://www.youtube.com/@openeuler
    label: YouTube
  - icon: ./images/bilibili_light.png
    icon_dark: ./images/bilibili_dark.png
    icon_primary: ./images/bilibili_primary.png
    href: https://space.bilibili.com/527064077
    label: Bilibili

# handy_materials: 资源推荐
#   title: 标题
#   desc: 描述
#   href: 链接
#   icon: 图标（SVG，带 ?raw 后缀以获取文件内容）
handy_materials:
  - title: openEuler社区文档
    desc: 帮助开发者快速了解 openEuler，包括发行说明、系统安装、管理员指南、虚拟化和容器等各类项目说明与使用指导
    href: https://docs.openeuler.org/zh/
    icon: ./images/icon-contact5.svg?raw
  - title: 获取openEuler OS
    desc: 提供获取openEuler的不同方式，公有云、容器镜像、windows、MacOS等
    href: https://www.openeuler.org/zh/download/#get-openeuler
    icon: ./images/icon-contact6.svg?raw
  - title: 参与社区贡献
    desc: 欢迎大家以各种形式参与社区贡献，包括但不限于提交issue、提交pr、参与讨论、代码贡献、文档捉虫等
    href: https://www.openeuler.org/zh/community/contribution/
    icon: ./images/icon-contact7.svg?raw
