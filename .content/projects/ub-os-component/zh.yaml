# UB OS Component 中文 数据
# repo_list: UB OS 组件代码仓列表
# related_links: 相关入口链接

repo_list:
  - name: Device Mgmt<br>(灵衢设备管理)
    row_key: name
    children:
      - module: UB Device Mgmt
        row_key: module
        children:
          - function: UBus Driver
            desc: 包含ubfi、ubus、vendor_ubus三个模块。其中ubfi负责解析BIOS上报的UBRT表、注册平台设备、生成所需的Bus Controller等功能，ubus基于Bus Controller提供UB总线的枚举、UB设备创建、UB设备管理、错误处理、热拔插、中断等和设备相关的基础服务。vendor_ubus为厂商差异化实现，负责和厂商硬件交互。
            repo_link:
              - openeuler/kernel/tree/OLK-6.6/drivers/ub/ubus
              - openeuler/kernel/tree/OLK-6.6/drivers/ub/ubfi
            repo:
              - openeuler/kernel/drivers/ub/ubus
              - openeuler/kernel/drivers/ub/ubfi
          - function: UVB
            desc: 内核态UBIOS协议实现，负责OS内核与BIOS交互的通道。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/firmware/uvb
            repo: openeuler/kernel/drivers/firmware/uvb
          - function: ubtool
            desc: ubctl命令行工具驱动，用于查询公共功能配置、模块状态、统计数据和固件信息
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/fwctl/ub
            repo: openeuler/kernel/drivers/fwctl/ub
      - module: UB User Driver
        row_key: module
        children:
          - function: User UDMA driver
            desc: 由硬件供应商提供的URMA通信设备驱动，可在用户态接入UMDK。
            repo_link: openeuler/umdk/tree/master/src/urma/hw/udma
            repo: openeuler/umdk/src/urma/hw/udma
          - function: libcdma
            desc: CDMA库为用户空间应用程序提供了CDMA功能，支持主机之间或主机与设备之间异步的内存读写操作。
            repo_link: openeuler/cdma
            repo: openeuler/cdma
          - function: libummu
            desc: 提供UMMU设备注册、初始化、配置表管理、地址转换表管理及权限表管理等功能。
            repo_link: openeuler/ummu
            repo: openeuler/ummu
      - module: Tools
        row_key: module
        children:
          - function: ubutils
            desc: 提供UB设备管理的工具，实现UB拓扑查询、配置空间查询及配置等功能。
            repo_link: openeuler/ubutils
            repo: openeuler/ubutils
          - function: ubtool
            desc: ubctl命令行工具，用于查询公共功能配置、模块状态、统计数据和固件信息
            repo_link: openeuler/ubctl
            repo: openeuler/ubctl
  - name: Memory Mgmt<br>(池化内存管理)
    row_key: name
    children:
      - module: Pooled Memory Mgmt
        row_key: module
        children:
          - function: OBMM
            desc: 提供内存拆借接口（EXPORT和IMPORT）、一致性维护接口（一致性维护接口仅在内存共享场景使用）。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/obmm
            repo: openeuler/kernel/drivers/ub/obmm
          - function: ummu-core
            desc: 提供基础的TokenID管理和《灵衢基础规范2.0》中定义的高级能力的配置和管理。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/iommu/hisilicon/ummu-core
            repo: openeuler/kernel/drivers/iommu/hisilicon/ummu-core
          - function: sysSentry
            desc: 当紧急事件（OOM、Panic、reboot等）发生时将相关的紧急事件阻塞，并上报事件到sysSentry Service。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/sentry
            repo: openeuler/kernel/drivers/ub/sentry
      - module: UBMM Lib
        row_key: module
        children:
          - function: libobmm
            desc: 提供内存拆借接口（EXPORT和IMPORT）、一致性维护接口（一致性维护接口仅在内存共享场景使用）。
            repo_link: openeuler/obmm
            repo: openeuler/obmm
          - function: sysSentry Service
            desc: 当紧急事件（OOM、Panic、reboot等）发生时将相关的紧急事件阻塞，并上报事件到UBPRM中，防止发生数据丢失或业务中断，同时也负责统一管理通过UB event上报的事件。
            repo_link: openeuler/sysSentry
            repo: openeuler/sysSentry
  - name: Communication<br>(灵衢通信)
    row_key: name
    children:
      - module: Connection Mgmt & Communication
        row_key: module
        children:
          - function: ubcore
            desc: 负责建链、Jetty，Segment等资源申请、状态管理等核心功能。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/urma/ubcore
            repo: openeuler/kernel/drivers/ub/urma/ubcore
          - function: uburma
            desc: 用户态库与内核态核心层的消息通信框架。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/urma/uburma
            repo: openeuler/kernel/drivers/ub/urma/uburma
          - function: ubagg
            desc: 网卡设备管理库，提供多网卡设备聚合、流量分发能力。
            repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/urma/ubagg
            repo: openeuler/kernel/drivers/ub/urma/ubagg
          - function: UMS
            desc: Socket over UB，支持Socket API零修改接入UB。
            repo_link: openeuler/umdk/tree/master/src/usock/ums
            repo: openeuler/umdk/src/usock/ums
      - module: UBComm Lib
        row_key: module
        children:
          - function: liburma
            desc: 高性能UB通信库，北向定义UB访问接口，南向定义驱动接口。
            repo_link: openeuler/umdk/tree/master/src/urma/lib/urma/core
            repo: openeuler/umdk/src/urma/lib/urma/core
          - function: libubagg
            desc: 网卡设备管理库，提供多网卡设备聚合、流量分发能力。
            repo_link: openeuler/umdk/tree/master/src/urma/lib/urma/bond
            repo: openeuler/umdk/src/urma/lib/urma/bond
          - function: uvs
            desc: 感知全局网络，负责连接建立，连接复用与虚拟化。
            repo_link: openeuler/umdk/tree/master/src/urma/lib/uvs
            repo: openeuler/umdk/src/urma/lib/uvs
          - function: libdlock
            desc: 基于UB构建的通用分布式锁服务。
            repo_link: openeuler/umdk/tree/master/src/ulock/dlock
            repo: openeuler/umdk/src/ulock/dlock
          - function: liburpc
            desc: 用户态提供基于UB的高性能RPC语义通信库。
            repo_link: openeuler/umdk/tree/master/src/urpc/framework
            repo: openeuler/umdk/src/urpc/framework
          - function: libumq
            desc: UB用户态高性能消息队列。
            repo_link: openeuler/umdk/tree/master/src/urpc/umq
            repo: openeuler/umdk/src/urpc/umq
      - module: Tools
        row_key: module
        children:
          - function: urma tools
            desc: urma管理工具。
            repo_link: openeuler/umdk/tree/master/src/urma/tools
            repo: openeuler/umdk/src/urma/tools
          - function: ums tools
            desc: ums管理工具。
            repo_link: openeuler/umdk/tree/master/src/usock/ums/tools
            repo: openeuler/umdk/src/usock/ums/tools
          - function: urpc tools
            desc: urpc管理工具。
            repo_link: openeuler/umdk/tree/master/src/urpc/tools
            repo: openeuler/umdk/src/urpc/tools
  - name: Virtualization<br>(灵衢设备虚拟化)
    row_key: name
    children:
      - module: vfio-ub
        row_key: module
        function: vfio-ub
        desc: 基于Linux已有vfio框架上新增支持UB设备虚拟化。
        repo_link: openeuler/kernel/tree/OLK-6.6/drivers/vfio/ubus
        repo: openeuler/kernel/drivers/vfio/ubus
      - module: QEMU
        function: qemu
        desc: 在虚拟机中提供UB总线虚拟化能力，支持UB总线设备模拟，并提供虚拟机直通访问UB原生设备的能力。
        repo_link: openeuler/qemu
        repo: openeuler/qemu
      - module: libvirt
        function: libvirt
        desc: 提供北向API供产品UBS EngineXLink调用，管理UBNative虚拟机生命周期；提供UB场景下高速虚机热迁移能力。
        repo_link: openeuler/libvirt
        repo: openeuler/libvirt
  - name: 设备驱动
    row_key: name
    children:
      - module: unic driver
        function: UNIC
        desc: 基于以太和UB link基础上对接Linux内核TCP/IP协议栈对应用提供socket接口的节点间通信服务。
        repo_link: openeuler/kernel/tree/OLK-6.6/drivers/net/ub
        repo: openeuler/kernel/drivers/net/ub
      - module: udma driver
        function: UDMA driver
        desc: 向上对接URMA协议栈，和协议栈一起配合实现标准URMA API接口；向下对接UB硬件的编程接口，使能硬件UB通信功能。
        repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/urma/hw/udma
        repo: openeuler/kernel/drivers/ub/urma/hw/udma
      - module: cdma driver
        function: CDMA
        desc: 负责创建和销毁CDMA设备，以及在CDMA设备中创建资源以执行DMA读写任务，并获取已执行任务的完成状态。
        repo_link: openeuler/kernel/tree/OLK-6.6/drivers/ub/cdma
        repo: openeuler/kernel/drivers/ub/cdma
      - module: ummu driver
        function: ummu driver
        desc: 提供UMMU设备注册、初始化、配置表管理、地址转换表管理及权限表管理等功能。
        repo_link: openeuler/kernel/tree/OLK-6.6/drivers/iommu/hisilicon
        repo: openeuler/kernel/drivers/iommu/hisilicon
  - name: 性能优化
    row_key: name
    children:
      - module: memlink
        function: memlink
        desc: 用于回收虚拟机内部空闲内存。
        repo_link: openeuler/memlink
        repo: openeuler/memlink
      - module: UB Turbo
        row_key: module
        children:
          - function: HAM
            desc: 基于灵衢冷热识别与数据迁移能力优化虚机迁移流程。
            repo_link: openeuler/ham
            repo: openeuler/ham
          - function: RMRS Agent
            desc: 管理节点内存资源，进行虚机间内存资源调度，提升资源利用率和性能。
            repo_link: openeuler/ubturbo
            repo: openeuler/ubturbo
          - function: SMAP
            desc: 基于芯片判热功能，识别应用访问的冷热数据，进行数据迁移，提升分级内存场景应用性能。
            repo_link: openeuler/ubturbo
            repo: openeuler/ubturbo
related_links:
  - icon: ./images/icon-white-paper.svg?raw
    title: 灵衢总线官网
    desc: 查看灵衢基础规范、白皮书等
    href: https://www.unifiedbus.com/zh
    is_outlink: true
  - icon: ./images/icon-code-repo.svg?raw
    title: 相关 SIG 组
    desc: 查看 sig-UnifiedBus 会议、联系方式等信息
    href: /zh/sig/sig-UnifiedBus
