# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  entrance_list:
    label: 入口卡片列表
    fields:
      icon: 入口图标（SVG，inline 消费，路径带 ?raw）
      title: 卡片标题
      desc: 卡片描述
      href: 链接地址
      is_outlink: 是否为外部链接（可选）
  whitepaper:
    label: 白皮书链接
    fields:
      zh: 中文白皮书路径
      en: 英文白皮书路径
en:
  entrance_list:
    label: Entrance card list
    fields:
      icon: Entrance icon (SVG, inline consumption, path uses ?raw)
      title: Card title
      desc: Card description
      href: Link URL
      is_outlink: Whether this is an external link (optional)
  whitepaper:
    label: White paper links
    fields:
      zh: Chinese white paper path
      en: English white paper path
