# 线上会议页数据 / Online Meeting page data
#
# participate: 参与方式列表（4 种：会议指南/SIG 例会/技术直播/订阅邮件列表）
#   icon: 步骤图标（SVG，inline 消费，路径带 ?raw，用 createSvgIcon 转换）
#   title: 标题
#   desc: 描述
#   btn: 按钮列表（可选）
#     text: 按钮文案
#     url: 按钮链接
#   text: 微信群文案（可选，配合 we_chat 使用）
#   we_chat: 是否显示微信群入口（可选）

participate:
  - icon: ./images/icon-meeting-guide.svg?raw
    title: 会议指南
    desc: '当一个版本发布完成后，openEuler 社区会召开关于下一个版本的开发规划会议，会议以 SIG 组为单位，集中探讨未来6个月的技术发展规划、工作事项、优先级等。该会议遵循开源开放原则，任何人均可申报需求，参与讨论。'
    btn:
      - text: 查看详情
        url: /zh/sig/meeting-guide/
  - icon: ./images/icon-sig-meeting.svg?raw
    title: SIG 例会
    desc: 'openEuler SIG 组会定期组织线上会议，以便SIG成员了解各项目的进展与状态，推动交付成果输出，让其成为openEuler 发行的一部分或 openEuler 扩展包的一部分。'
    btn:
      - text: 查看预定方式
        url: /zh/blog/liuqi/2022-07-15-openeuler-miniprogram-guide.html
  - icon: ./images/icon-live.svg?raw
    title: 技术直播
    desc: 'openEuler 社区B站直播开放预约中，如果您想分享您的技术实践、项目成果、开源经验等，欢迎联系社区小助手（微信号：openeuler123）预定。'
    text: '社区小助手：openeuler123'
    we_chat: true
  - icon: ./images/icon-mail.svg?raw
    title: 订阅邮件列表
    desc: '开发者可前往 SIG 中心 查看感兴趣的 SIG，订阅 SIG 邮件列表，随时获取各SIG组的会议动态。'
    btn:
      - text: 前往 SIG 中心
        url: /zh/sig/sig-list/
      - text: SIG 邮件列表
        url: /zh/community/mailing-list/
