# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  participate:
    label: 参与方式列表
    fields:
      icon: 步骤图标（SVG，inline 消费，路径带 ?raw，用 createSvgIcon 转换）
      title: 标题
      desc: 描述
      btn: 按钮列表（可选）
      btn[].text: 按钮文案
      btn[].url: 按钮链接
      text: 微信群文案（可选，配合 we_chat 使用）
      we_chat: 是否显示微信群入口（可选）
