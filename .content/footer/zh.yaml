# 页脚数据 / Footer data
#
# 结构与 OFooter props（@opendesign-plus/components）对齐：
# info / friendshipLink / footerLogo / qrcode 为纯静态数据，组件导入后直接传给 OFooter；
# quickNav / footerOption / footer_bg_img 含变量（__ENV:VITE_XXX__ 环境变量占位符、{year} 年份、屏宽切换），组件内做一轮替换后传用。
#
# info: 开放原子基金会介绍（页脚顶部）
#   title: 介绍文案
#   logo: 基金会 logo
#   href: 基金会链接
#
# quickNav: 底部导航（按列分组，从左到右）
#   title: 列标题
#   children: 导航项（title: 名称 / href: 链接，支持 __ENV:VITE_XXX__ 占位符）
#
# qrcode: 右侧二维码（英文站为空数组，不展示）
#   img: 二维码图片
#   label: 二维码名称
#
# friendshipLink: 友情链接
#   title: 板块标题
#   children: 链接列表（href: 链接地址 / title: 站点名称）
#
# footerLogo: openEuler 标识与联系方式
#   logo: openEuler logo
#   email: 联系邮箱
#
# footerOption: 底部声明区
#   children: 声明链接（title: 名称 / href: 链接，支持 __ENV:VITE_XXX__ 占位符）
#   license_text → licenseText: 许可证前缀文案
#   license_info → licenseInfo: 许可证名称
#   copyright: 版权文案（{year} 为年份占位符，运行时替换）
#   beian_info_1/beian_info_2 → beianInfo1/beianInfo2: 备案文案
#   beian_link → beianLink: 备案链接
#   police_icon → policeIcon: 备案图标
#
# footer_bg_img: 页脚背景图（组件按屏宽取 pc/mb）
#   pc: PC 背景图
#   mb: 移动端背景图

info:
  title: 'openEuler是由开放原子开源基金会孵化的全场景开源操作系统项目，面向数字基础设施四大核心场景（服务器、云计算、边缘计算、嵌入式），全面支持ARM、x86、RISC-V、LoongArch、PowerPC、SW-64等多样性计算架构'
  logo: ./images/atom-logo.png
  href: 'https://openatom.cn'

