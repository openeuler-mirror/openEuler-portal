      - title: Governance
        href: /en/community/organization/
      - title: Code of Conduct
        href: /en/community/conduct/
      - title: Statistics
        href: __ENV:VITE_SERVICE_DATASTAT_URL__/en/overview
  - title: News & Blogs
    children:
