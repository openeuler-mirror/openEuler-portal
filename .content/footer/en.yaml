# Footer data
#
# Structure aligned with OFooter props (@opendesign-plus/components):
# info / friendshipLink / footerLogo / qrcode are pure static data, passed to
# OFooter as-is; quickNav / footerOption / footer_bg_img contain variables
# (__ENV:VITE_XXX__ env placeholders, {year} year, screen-width switch) and go
# through one replacement round in the component.
#
# info: OpenAtom Foundation introduction (footer top)
#   title: Introduction text
#   logo: Foundation logo
#   href: Foundation link
#
# quickNav: Footer navigation (grouped by column, left to right)
#   title: Column title
#   children: Nav items (title: name / href: link, supports __ENV:VITE_XXX__ placeholders)
#
# qrcode: QR codes on the right (empty array on the English site, not displayed)
#   img: QR code image
#   label: QR code name
#
# friendshipLink: Friendly community links
#   title: Section title
#   children: Link list (href: link URL / title: site name)
#
# footerLogo: openEuler brand and contact
#   logo: openEuler logo
#   email: Contact email
#
# footerOption: Footer statement area
#   children: Statement links (title: name / href: link, supports __ENV:VITE_XXX__ placeholders)
#   licenseText: License prefix text
#   licenseInfo: License name
#   copyright: Copyright text ({year} is a year placeholder, replaced at runtime)
#   beianInfo1/beianInfo2: Filing texts
#   beianLink: Filing link
#   policeIcon: Filing icon
#
# footer_bg_img: Footer background images (pc/mb picked by screen width in component)
#   pc: PC background
#   mb: Mobile background

info:
  title: 'openEuler, an open source OS incubated by the OpenAtom Foundation for digital infrastructure in server, cloud, edge, embedded scenarios, across Arm, x86, RISC-V, LoongArch, PowerPC, and SW-64 architectures.'
  logo: ./images/atom-logo.png
  href: 'https://openatom.cn'

