        href: /en/interaction/news-list/
      - title: Blogs
        href: /en/interaction/blog-list/
      - title: White Papers
        href: /en/showcase/technical-white-paper/
  - title: Access
    children:
      - title: openEuler Is Everywhere
        href: /en/download/#get-openeuler
      - title: Latest Community Releases
        href: /en/download/
      - title: Commercial Releases
        href: /en/download/commercial-release/
  - title: Services & Resources
    children:
      - title: Documentation
        href: __ENV:VITE_SERVICE_DOCS_URL__/en/
      - title: FAQ
        href: __ENV:VITE_MAIN_DOMAIN_URL__/en/faq/
      - title: Contact Us
        href: /en/contact-us/
  - title: Communicate
    children:
      - title: Mailing Lists
        href: /en/community/mailing-list/
      - title: Activities
        href: /en/interaction/event-list/
      - title: Forum
        href: __ENV:VITE_SERVICE_FORUM_URL__
  - title: Contribute
    children:
      - title: SIGs
        href: /en/sig/sig-list/
      - title: Contribution Guide
        href: /en/community/contribution/
      - title: Training
        href: /en/learn/mooc/

qrcode: []

friendshipLink:
