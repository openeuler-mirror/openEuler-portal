# SIG 角色说明页数据 / SIG Role Description page data
#
# community_member: 社区成员板块（页面最上方，3 个角色卡片 + 2 个引导卡片）
# contributor: 贡献者板块
# committer: 审核者板块
# maintainer: 维护者板块

# ============ 社区成员 ============
community_member:
  title: 社区成员
  subtitle: 在openEuler社区，大部分角色的职责限于 SIG (Special Interest Group)内。Maintainer 和 Committer 在 AtomGit 的权限上不做区分，两者的区分主要是集中在 SIG 治理的管理范围，详细可见下面的描述
  view_detail: 查看详情
  # types: 3 个角色卡片（贡献者/审核者/维护者）
  types:
    - bg: ./images/role-desc-contributor.png
      bg_mb: ./images/role-desc-contributor.png
      name: 贡献者
      responsibilitiy: 职责范围：SIG组及项目的重要贡献者，代码仓库问题的主要修复者和代码开发者
      href: contributor
    - bg: ./images/role-desc-committer.png
      bg_mb: ./images/role-desc-committer.png
      name: 审核者
      responsibilitiy: 职责范围：SIG组部分仓库的看护者，是这部分仓库的第一责任人，审核其他成员的贡献
      requirement: 要求：SIG 的积极贡献者，经验丰富，愿意投入精力参与到审核工作
      href: committer
    - bg: ./images/role-desc-maintainer.png
      bg_mb: ./images/role-desc-maintainer.png
      name: 维护者
      responsibilitiy: 职责范围：SIG组组长、牵引者和规划者，需做好SIG组的发展和演进，同时也可能是项目Owner
      requirement: 要求：经验丰富，富有责任心、出色的技术能力和管理能力
      href: maintainer
  # cards: 2 个引导卡片（新贡献者/既有社区成员）
  cards:
    - icon: ./images/icon-contributor.svg?raw
      name: 新的贡献者
      desc: '欢迎新成员加入社区。我们有关于如何开始贡献的指导文档请参考：<a href="https://atomgit.com/openeuler/community/blob/master/zh/contributors/README.md" target="_blank" rel="noopener noreferrer" class="underline-link">openEuler 贡献</a>'
    - icon: ./images/icon-had-contributor.svg?raw
      name: 既有社区成员
      desc: '既有的社区成员应遵守<a href="https://atomgit.com/openeuler/community/blob/master/code-of-conduct.md" target="_blank" rel="noopener noreferrer" class="underline-link">openEuler 社区的行为守则</a>以及<a href="https://atomgit.com/openeuler/community/blob/master/zh/technical-committee/governance/openEuler%E7%A4%BE%E5%8C%BA%E5%BC%80%E5%8F%91%E8%A1%8C%E4%B8%BA%E8%A7%84%E8%8C%83.md" target="_blank" rel="noopener noreferrer" class="underline-link">openEuler 社区开发行为规范</a>，熟悉 SIG 的组织、角色、政策、软件、约定等，以及相关的技术和/或写作能力。社区成员角色的期望、职责和要求，请参考下面的内容'

# ============ 贡献者 ============
contributor:
  id: contributor
  title: 贡献者 Contributor
  subtitle:
    - 贡献者是openEuler社区中持续活跃的成员，他们通过代码提交、文档编写、项目开发、社区维护、问题解决、会议活动等方式参与openEuler，推动社区的持续发展
  card_point_bg: ./images/contributor-point.png
  cards:
    - bg_light: ./images/contributor-light.png
      bg_dark: ./images/contributor-dark.png
      bg_mb_light: ./images/contributor-mb-light.png
      bg_mb_dark: ./images/contributor-mb-dark.png
      title: 加入要求
      desc: ''
      points:
        - AtomGit 上的注册会员
        - 为 SIG 或社区做出多方面贡献，包括不限于：在 AtomGit 上提交或审核 PR；在 AtomGit 上对问题进行归档或评论；参与 SIG 或社区讨论
        - '已阅读 <a href="https://atomgit.com/openeuler/community/blob/master/zh/contributors/README.md" target="_blank" rel="noopener noreferrer" class="underline-link">贡献者指南</a>'
        - 积极参与 1 个或多个 SIG
    - bg_light: ./images/contributor-light.png
      bg_dark: ./images/contributor-dark.png
      bg_mb_light: ./images/contributor-mb-light.png
      bg_mb_dark: ./images/contributor-mb-dark.png
      title: 责任与权益
      desc: ''
      notice: 注意：经常贡献代码的成员应积极的参与代码审查，并努力成为 SIG 的审核者 Committer
      points:
        - 响应被分配的问题和 PR
        - 贡献的代码应该：经过良好的测试；能够让测试用例始终通过；解决后继发生的错误或问题
        - 可以分配问题或 PR

# ============ 审核者 ============
committer:
  id: committer
  title: 审核者 Committer
  subtitle:
    - 审核者是拥有代码合入权限的核心贡献者，也是代码仓库的看护者，确保代码质量和正确性，对项目发展负有重要责任
    - 定义：openEuler SIG 拥有的存储库中 sig-info.yaml 文件中的 Committer 条目
  card_point_bg: ./images/committer-point.png
  cards:
    - bg_light: ./images/committer-light1.png
      bg_dark: ./images/committer-dark1.png
      bg_mb_light: ./images/committer-mb-light1.png
      bg_mb_dark: ./images/committer-mb-dark1.png
      title: 加入要求
      desc: ''
      points:
        - 作为贡献者至少 3 个月
        - 作为主要审阅者至少参与了 6 次 PR 的审阅
        - 审阅或合并至少 20 个基本 PR 到代码库
        - 熟悉代码库
        - 可以自我提名，或由该 SIG 的审核者或维护者提名
    - bg_light: ./images/committer-light2.png
      bg_dark: ./images/committer-dark2.png
      bg_mb_light: ./images/committer-mb-light2.png
      bg_mb_dark: ./images/committer-mb-dark2.png
      title: 责任与权益
      desc: ''
      points:
        - '评审 PR：对 Contributor 提交的 PR 完成评审，评审可以参考社区的<a href="https://atomgit.com/openeuler/community/blob/master/zh/contributors/packaging.md" target="_blank" rel="noopener noreferrer" class="underline-link">软件包开发规范</a>和<a href="https://atomgit.com/openeuler/security-committee/blob/master/docs/zh/developer-guide/SecureCoding.md"  target="_blank" rel="noopener noreferrer" class="underline-link">安全编程指南</a>。'
        - '分发处理问题:请参考“<a href="https://atomgit.com/openeuler/community/blob/master/zh/contributors/issue-submit.md" target="_blank" rel="noopener noreferrer" class="underline-link">问题处理流程</a>”'
        - 跟踪依赖性问题：在开发分支中，其他 SIG 组的软件包的更新可能会到导致破坏本 SIG 内软件包的依赖关系。此时 Committer 会收到告警提示，Committer 应尽力重建软件包。依赖关系出错可能会使最终用户无法更新系统，打包团队也会介入并重建存在依赖性问题的软件包，但 Committer 不应依赖这些重建
        - '如有接口变更，通知可能会影响到的 SIG：其他 SIG 或项目会依赖本 SIG 的软件包，对软件包接口的变更可能会对他们造成影响。Committer 应了解并评审&决策变更造成的依赖影响，并公告和发送 API 或 ABI 变更的告警邮件。这类公告应在变更发生至少一周前完成，并应通知到所有可能受影响的 SIG。具体请参考<a href="https://www.openeuler.org/zh/oEEP/?name=oEEP-0009%20openEuler%20LTS%20%E7%89%88%E6%9C%AC%E5%86%85%E6%A0%B8%20KABI%20%E5%8F%98%E6%9B%B4%E7%AD%96%E7%95%A5" target="_blank" rel="noopener noreferrer" class="underline-link">KABI接口变更评审实例</a>'
        - '更新和维护软件包版本：遵守社区的<a href="https://www.openeuler.org/zh/oEEP/?name=oEEP-0017%20openEuler%E8%BD%AF%E4%BB%B6%E8%B4%A8%E9%87%8F%E5%88%86%E7%BA%A7%26%E6%89%A7%E8%A1%8C%E7%AD%96%E7%95%A5" target="_blank" rel="noopener noreferrer" class="underline-link">软件包更新质量控制策略</a>完成软件包的更新'
        - 和上游社区合作，包括：将所有变更推送到上游社区；参与上游社区邮件列表；获取上游社区的 bug 跟踪器的账户，并跟踪上游社区的重要 bug；将严重的错误转发给上游社区以寻求帮助
        - 和测试团队合作，包括：在提交软件包时，向质量检查人员提供如何调试/分类软件包的信息，以供问题的分类；提供基本功能的测试用例，用于测试回归；提交软件包更新时，提供有关更新中已经修复问题的测试用例，以供质量检查人员使用

# ============ 维护者 ============
maintainer:
  id: maintainer
  title: 维护者 Maintainer
  subtitle:
    - 维护者是 SIG 组的管理者、牵引者、规划者，他们主导相关代码的审核、更新和修复，确保其稳定性和兼容性，是项目生态的关键角色。所有审核者的责任与权力，维护者均具有。除此之外，维护者还需承担SIG团队的技术路线、内外协调等工作
    - 定义：openEuler SIG 拥有的存储库中 sig-info.yaml 文件中的 Maintainer 条目
  card_point_bg: ./images/maintainer-point.png
  cards:
    - bg_light: ./images/maintainer-light.png
      bg_dark: ./images/maintainer-dark.png
      bg_mb_light: ./images/maintainer-mb-light1.png
      bg_mb_dark: ./images/maintainer-mb-dark1.png
      title: 加入要求
      desc: ''
      points:
        - 作为审核者至少 3 个月
        - 作为主要审阅者至少参与了 12 次 PR 的审阅
        - 审阅或合并至少 30 个基本 PR 到代码库
        - 熟悉代码库
        - 可以自我提名，也可以由子项目 Maintainer 提名，并且没有其他子项目 Maintainer 的反对
    - bg_light: ./images/maintainer-light.png
      bg_dark: ./images/maintainer-dark.png
      bg_mb_light: ./images/maintainer-mb-light2.png
      bg_mb_dark: ./images/maintainer-mb-dark2.png
      title: 责任与权益
      desc: ''
      points:
        - 确定SIG所负责项目的技术路线：包括规划和决策 SIG 技术方向、路标规划、架构演进。
        - 制定SIG所负责项目的发布计划：确定 SIG 的关键需求和发布计划；参与社区的 PM 活动，并协调 SIG 计划和社区版本的里程碑时间表匹配。
        - 参与社区协调活动：作为 SIG 的代表参与 openEuler 技术委员会或理事会组织的活动和特定会议等。
        - 召集SIG组会议：定期召集 SIG 会议，决策 SIG 内上升的争议
