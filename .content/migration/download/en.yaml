#     link: Button link (normal jump, optional; mutually exclusive with soft_links)
#     soft_links: Software package link list (dropdown options, optional; mutually exclusive with link)
#       name: Package name
#       link: Package link

name: x2openEuler
description: 'x2openEuler is a migration tool that streamlines the move of source OSs to openEuler. To negate the manual and inaccurate operations of conventional methods, an easy-to-use UI lets you perform in-place upgrade of OSs in batches. You can batch add nodes to be upgraded for analysis, planning, and compatibility tests. Then batch upgrade the adapted nodes to achieve an end-to-end seamless migration.'

