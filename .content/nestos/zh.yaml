# feature_map: 功能详情页内容（6 个功能，key 为功能 slug）
#   title_key: 标题 i18n key
#   desc_key: 描述 i18n key
#   sections: 章节列表
#     type: 章节类型（text/heading/list/code/image/link）
#     content: 文本内容（text/heading/code/link 类型）
#     items: 列表项数组（list 类型）
#     src: 图片路径（image 类型，相对当前 yaml）
#     href: 链接（link 类型）
feature_map:
  kernel:
    title_key: nestos.feature1Title
    desc_key: nestos.feature1Desc
    sections:
      - type: heading
        content: 1、Compact Numa Aware (CNA) spinlock 功能支持
      - type: text
        content: 支持CNA spinlock功能，使qspinlock在不同NUMA节点上的CPU竞争spinlock时，尽量将锁交给同一NUMA节点的CPU，以减少跨NUMA的次数。开启该功能后，sysbench测试中可以获得10%以上的性能提升。
      - type: heading
        content: 2、虚拟机启动优化
      - type: text
        content: 优化irqbypass列表遍历和锁争用，加速高密度场景下虚拟机的并发启动。
      - type: heading
        content: 3、memcg THP control
      - type: text
        content: 通过在cgroup中添加THP的控制，解决THP（Transparent Huge Pages）带来的内存性能优化和增加内存负担的矛盾。
      - type: heading
        content: 4、UKFEF
      - type: text
        content: 支持UKFEF功能，系统可以对各种可能引发系统异常事件进行统计，并自动评估事件的严重程度，方便开发和运维人员定位问题。
      - type: heading
        content: 5、性能调优
      - type: text
        content: 将容器网络namespace中的net.core.somaxconn缺省值调至4096，减少高并发情况下半连接队列满的丢包问题；关闭cgroup.memory，使能后会在slab管理的page分配和释放流程上增加额外的处理逻辑，对性能造成影响；使能iommu.passthrough，在物理机环境中，减少页表映射的转换。
      - type: heading
        content: 6、支持线程 NAPI
      - type: text
        content: 通过为每个支持NAPI的网络接口创建独立的内核线程，NAPI轮询工作可以从原先的软中断上下文切换到内核线程上下文中进行，从而提高网络资源的管理效率。
      - type: heading
        content: 7、支持pagecache limit 功能
      - type: text
        content: 提供一种限制page cache的能力，能够对page cache的总量进行控制，增强系统在数据库等page cache占比较高场景下的稳定性。
  pilotgo:
    title_key: nestos.feature2Title
    desc_key: nestos.feature2Desc
    sections:
      - type: text
        content: PilotGo是麒麟软件在openEuler社区孵化的插件式运维管理平台。本次PilotGo针对NestOS平台特性及最佳应用实践，为NestOS平台带来了定制化的运维管理功能及全新的架构感知插件特性。
      - type: heading
        content: 功能概览：
      - type: list
        items:
          - 1、NestOS平台双模式纳管及日常运维处理；
          - 2、单机资源及进程结构可视化；
          - 3、多机应用集群拓扑图展示。
      - type: heading
        content: 效果展示：
      - type: text
        content: 1、PilotGo 纳管 NestOS 系统；
      - type: image
        src: ./images/two_1.png
        content: PilotGo 纳管 NestOS
      - type: text
        content: 2、集群拓扑展示；
      - type: image
        src: ./images/two_2.png
        content: 集群拓扑
      - type: text
        content: 3、集群拓扑节点信息展示。
      - type: image
        src: ./images/two_3.png
        content: 集群拓扑节点信息
  nkd:
    title_key: nestos.feature3Title
    desc_key: nestos.feature3Desc
    sections:
      - type: text
        content: nestos-kubernetes-deployer简称NKD，是基于NestOS部署kubernetes集群运维而准备的解决方案。其目标是在集群外提供对集群基础设施（包括操作系统和K8S基础组件）的部署、更新和配置管理等服务。
      - type: heading
        content: 1、NKD的整体架构：
      - type: list
        items:
          - 主体模块NKDS（NestOS-kubernetes-deployer-service）：包括部署集群所需的基础设施管理和配置管理，创建系统点火阶段所需的Ignition文件；
          - 升级模块housekeeper：包括部署到集群中HKO (housekeeper operator)，与集成到系统镜像中的HKD（housekeeper daemon）组件；
          - NKD根据集群需求，连接基础设施提供商动态创建所需的IaaS资源，支持裸金属和虚拟化场景，目前优先实现openstack场景。
      - type: image
        src: ./images/three_1.png
        content: NKD架构图
      - type: heading
        content: 2、效果演示：
      - type: heading
        content: 演示环境
      - type: list
        items:
          - (1) master、worker节点各部署三个实例
          - (2) NestOS版本：NestOS For Container 22.03_LTS_SP2
      - type: text
        content: 部署集群基础设施
      - type: image
        src: ./images/three_2.png
        content: 部署集群基础设施
      - type: heading
        content: 集群部署完成
      - type: text
        content: (1) 查看节点处于Ready状态
      - type: image
        src: ./images/three_3.png
        content: 节点Ready状态
      - type: text
        content: (2) 查看Pod处于running状态
      - type: image
        src: ./images/three_4.png
        content: Pod运行状态
      - type: heading
        content: 集群版本升级
      - type: text
        content: (1) K8S版本升级前
      - type: image
        src: ./images/three_5.png
