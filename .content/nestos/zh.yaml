  rubik:
    title_key: nestos.feature4Title
    desc_key: nestos.feature4Desc
    sections:
      - type: text
        content: Rubik是一个自适应单机算力调优和服务质量保障的容器混部引擎，NestOS For Container版本已预开启Rubik在离线混部相关内核特性，支持基于rubik容器混部引擎的整体解决方案，通过对资源进行合理调度与隔离，在保障关键业务服务质量的前提下极大提升容器云场景资源利用率。
      - type: image
        src: ./images/four.png
        content: Rubik混部架构
      - type: text
        content: 在NestOS For Container版本针对容器场景在离线混合部署进行了多项优化，其中包括：
      - type: heading
        content: 1、preemption绝对抢占
      - type: list
        items:
          - ○ CPU绝对抢占
          - ○ 内存绝对抢占
      - type: heading
        content: 2、dynCache 访存带宽和LLC限制
      - type: heading
        content: 3、dynMemory 内存异步分级回收
      - type: heading
        content: 4、支持弹性限流
      - type: list
        items:
          - ○ quotaBurst 支持弹性限流内核态解决方案
          - ○ quotaTurbo 支持弹性限流用户态解决方案
      - type: heading
        content: 5、ioCost 支持iocost对IO权重控制
      - type: heading
        content: 6、PSI 支持基于PSI指标的干扰检测
      - type: text
        content: 未来NestOS还将继续在在离线混部道路上实践，探索更多混部场景下提升资源利用率的手段和技术。
  custom-image:
    title_key: nestos.feature5Title
    desc_key: nestos.feature5Desc
    sections:
      - type: text
        content: NestOS for Containers，作为基于不可变基础设施思想的容器云底座操作系统，将文件系统作为一个整体进行分发和更新。这一方案在运维与安全方面带来了巨大的提升。然而，在实际生产环境中，官方发布的版本往往难以满足用户的需求，因此需要更方便的定制手段。现NestOS For Container集成ostree native container特性，可使容器云场景用户利用熟悉的技术栈，只需编写一个ContainerFile(Dockerfile)文件，即可轻松构建定制版镜像，用于自定义集成组件或后续的升级维护工作。
      - type: heading
        content: 简要定制步骤
      - type: list
        items:
          - 1. 选择与已部署环境相同发布流和架构的NestOS容器镜像作为base镜像
      - type: text
        content: 2. 编写Containerfile(Dockerfile)文件，示例如下：
      - type: code
        content: |-
          FROM hub.oepkgs.net/nestos/nestos-test:22.03-LTS-SP2.20230922.0-x86_64
          # 执行自定义构建步骤，例如安装软件或拷贝自构建组件
          RUN rpm-ostree install strace && rm -rf /var/cache && ostree container commit
      - type: text
        content: 3. 执行docker build或集成于CICD中构建相应镜像，推送至Registry以备使用
      - type: heading
        content: 简要部署步骤
      - type: text
        content: 1. 假设上述步骤构建容器镜像被推送为hub.oepkgs.net/nestos/nestos-test:demo-strace
      - type: text
        content: 2. 在已部署NestOS For Container的环境中执行如下命令：
      - type: code
        content: 'sudo rpm-ostree rebase ostree-unverified-registry:hub.oepkgs.net/nestos/nestos-test:demo-strace --bypass-driver'
      - type: text
        content: 3. 重新引导后完成定制版本部署
      - type: heading
        content: 效果展示
      - type: text
        content: ○ 部署过程
      - type: image
        src: ./images/five_1.png
        content: 部署过程
      - type: text
        content: ○ 完成部署
      - type: image
        src: ./images/five_2.png
        content: 完成部署
      - type: link
        content: 详细说明请参阅：NestOS For Container以OCI方式定制使用手册
        href: https://atomgit.com/openeuler/NestOS/blob/master/docs/zh/usr_manual/NestOS-For-Container%E4%BB%A5OCI%E6%96%B9%E5%BC%8F%E5%AE%9A%E5%88%B6%E4%BD%BF%E7%94%A8%E6%89%8B%E5%86%8C.md
  x2nestos:
    title_key: nestos.feature6Title
    desc_key: nestos.feature6Desc
    sections:
      - type: text
        content: x2nestos是一款将通用形态操作系统转换为 NestOS For Container 版本的快捷部署工具。NestOS For Virt版本默认集成，也可通用于以yum或apt主流包管理器管理的其他通用linux操作系统。该工具基于kexec动态加载内核特性，实现跳过引导阶段完成操作系统部署，有效降低现有集群转换为NestOS For Container难度和成本。
      - type: heading
        content: 适用场景：
      - type: list
        items:
          - 1. 现有容器云场景用户大规模批量转换场景
          - 2. 无BMC，不方便实地重新引导安装的远程环境
          - 3. 限制使用自定义镜像安装的云主机环境
          - 4. 个人爱好者尝鲜
      - type: heading
        content: 限制说明：
      - type: list
        items:
          - 1. 本转换工具非迁移工具，不保留磁盘数据
          - 2. 此转换不可逆
          - 3. 使用本工具时需保留足够空闲内存（推荐>2G）
      - type: heading
        content: 效果演示
      - type: text
        content: ○ 转换前
      - type: image
        src: ./images/six_before.png
        content: 转换前
      - type: text
        content: ○ 转换后
      - type: image
        src: ./images/six_after.png
        content: 转换后
      - type: link
        content: 详细说明请参阅：https://atomgit.com/openeuler/x2nestos
        href: https://atomgit.com/openeuler/x2nestos
