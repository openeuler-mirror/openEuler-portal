# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  banner:
    label: 规范页顶部横幅图
    fields: {}
  sections:
    label: 中文品牌规范章节
    fields:
      title: 章节标题
      img: 示例图
      desc: desc
en:
  banner:
    label: banner
    fields: {}
  sections:
    label: English brand specification sections
    fields:
      desc: desc
