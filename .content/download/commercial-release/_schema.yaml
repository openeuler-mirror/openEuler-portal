# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  commercial_release:
    label: 商业发行版列表
    fields:
      NAME: 发行版名称
      DOWNLOAD_URL: 下载链接
      DESC: 发行版描述
      MANUFACTURER: 厂商名称
      PUBLISH_DATE: 发布日期
      DETAILED_LINK: 架构详情链接（可选）
      DETAILED_LINK[].LINK: 架构专属下载链接（可选，部分仅有 ARCH 无 LINK）
      DETAILED_LINK[].ARCH: 支持的架构
      LTS: 是否为 LTS 版本（可选）
en:
  commercial_release:
    label: Commercial release list
    fields:
      NAME: Release name
      DOWNLOAD_URL: Download URL
      DESC: Release description
      MANUFACTURER: Vendor name
      PUBLISH_DATE: Release date
      DETAILED_LINK: Architecture detail links (optional)
      DETAILED_LINK[].LINK: Architecture-specific download link (optional, some have only ARCH)
      DETAILED_LINK[].ARCH: Supported architecture
      LTS: Whether LTS version (optional)
