# 下载页数据 / Download page data
#
# 板块按页面从上到下视觉顺序排列。
# 图片就近存放在 ./images/，zh/en 共用图不加后缀，主题变体保留 _light/_dark 后缀。
# SVG 作为 inline 图标（OCard :icon 组件消费）的路径带 ?raw，普通背景图不带 ?raw。

# community_versions: 首页"社区版本"tab 展示的版本名称列表（控制 COMMUNITY_LIST 中哪些版本显示）
#   版本名称字符串（zh/en 相同）
community_versions:
  - openEuler-24.03-LTS-SP4
  - openEuler Embedded 26.03
  - openEuler-24.03-LTS-SP3
  - openEuler-24.03-LTS-SP1

# get_os: 获取操作系统配置（6 种方式：公有云/容器/Windows/MacOS/虚拟化/树莓派）
#   id: 锚点 ID
#   bg_light/bg_dark: PC 端背景图（PNG，background-image 消费，zh/en 共用）
#   bg_mo_light/bg_mo_dark: 移动端背景图
#   title: 方式标题
#   intro: 方式简介
#   intro1: 安装指引文案（可选，仅 cloud/container 有）
#   intro_link: 安装指引链接（可选）
#   repeat: 布局参数（可选）
#   links: 子链接列表
#     href: 链接
#     label: 链接文案
#     introduce: 链接介绍
get_os:
  - id: cloud
    bg_light: ./images/public.png
    bg_dark: ./images/public_dark.png
    bg_mo_light: ./images/public_mo.png
    bg_mo_dark: ./images/public_mo_dark.png
    title: 公有云
    intro: openEuler 官方镜像在以下主流平台正式发布
    intro1: 安装指引
    intro_link: /zh/wiki/install/cloud/
    links:
      - href: /zh/wiki/install/cloud/#在aws获取openeuler镜像
        label: Amazon AWS
        introduce: Amazon Web Services(AWS)是全球最全面、应用最广泛的云服务平台。AWS Marketplace中提供了多个版本的openEuler云镜像
      - href: /zh/wiki/install/cloud/#azure获取openeuler共享镜像
        label: Azure
        introduce: Microsoft Azure是微软的公用云服务平台，提供行业领先的AI和云服务。Azure community images中可以找到openEuler云镜像，用户可以利用这些镜像在Azure上部署openEuler操作系统
      - href: /zh/wiki/install/cloud/#在阿里云获取openeuler镜像
        label: 阿里云
        introduce: 阿里云是阿里巴巴推出的云计算服务，涉及云计算的产品与服务。用户可以在云市场找到多版本的openEuler云镜像
      - href: /zh/wiki/install/cloud/#在华为云获取openeuler镜像
        label: 华为云
        introduce: 华为云提供包括弹性云服务器、对象存储服务等在内的云计算服务。openEuler社区已经将多版本的openEuler云镜像发布到华为云市场
      - href: /zh/wiki/install/cloud/#在腾讯云获取openeuler镜像
        label: 腾讯云
        introduce: 腾讯云是腾讯推出的云计算服务，构建覆盖全球的数据中心节点。openEuler社区积极拓展与腾讯云的合作，为用户提供更多版本的openEuler云镜像
  - id: container
    bg_light: ./images/docker.png
    bg_dark: ./images/docker_dark.png
    bg_mo_light: ./images/docker_mo.png
    bg_mo_dark: ./images/docker_mo_dark.png
    title: 容器镜像
    intro: openEuler 提供官方容器镜像
    intro1: 安装指引
    intro_link: /zh/wiki/install/image/
    links:
      - href: https://hub.docker.com/r/openeuler/openeuler
        label: Docker Hub
        introduce: Docker Hub是Docker提供的一项服务，是世界上最大的容器镜像存储库。openEuler社区将持续更新基础容器镜像和应用容器镜像至Docker Hub，以便开发者下载使用
      - href: https://quay.io/search?q=openeuler
        label: Quay.io
        introduce: Quay.io是容器化生态系统中的领先平台之一。openEuler社区在Quay.io上提供了基础容器镜像和应用容器镜像，用户可以在这里找到相应镜像的使用和介绍
      - href: https://hub.oepkgs.net/account/sign-in?globalSearch=openeuler
        label: 中科院软件所
        introduce: oepkgs全称开放软件包服务，是一个为openEuler以及其他Linux发行版提供软件包服务和容器镜像服务的第三方社区。目前oepkgs镜像源中已有2w+款软件包。oepkgs社区会对软件包进行构建测试，兼容性测试，并对oepkgs上软件包的源码仓进行生命周期管理
      - href: https://images.linuxcontainers.org/
        label: Linux Container
        introduce: Linux Container是一个为用户提供操作系统级虚拟化的工具集，它允许用户在同一台物理服务器上运行多个隔离的Linux容器。这些容器共享宿主机的内核，但在其他方面相互独立，类似于虚拟机但更加轻量级和高效
  - id: windows
    bg_light: ./images/windows.png
    bg_dark: ./images/windows_dark.png
    bg_mo_light: ./images/windows_mo.png
    bg_mo_dark: ./images/windows_mo_dark.png
    title: Windows
    intro: 在 Windows 上运行 openEuler
    repeat: 1
    links:
      - href: /zh/wiki/install/wsl/
        label: WSL(Windows Subsystem For Linux)
        introduce: Windows Subsystem For Linux (WSL) 是微软发布的让用户能够在Windows上使用Linux环境的技术。通过使用openEuler发布的WSL应用，可以让大家在Windows中体验原汁原味的openEuler开发环境。目前openEuler已经将多个版本WSL镜像相继上架到了微软应用商店，欢迎大家下载试用
  - id: macos
    bg_light: ./images/macos_light.png
    bg_dark: ./images/macos_dark.png
    bg_mo_light: ./images/macos_mo_light.png
    bg_mo_dark: ./images/macos_mo_dark.png
    title: MacOS
    intro: 在 MacOS 上运行 openEuler
    repeat: 1
    links:
      - href: /zh/wiki/install/macos/
        label: OrbStack
        introduce: OrbStack是一个为macOS设计的快速、轻量级且简单的虚拟机平台，用于运行Docker容器和Linux虚拟机。用户可以在OrbStack上充分利用openEuler社区提供的容器镜像
  - id: virtualization
    bg_light: ./images/virtualization.png
    bg_dark: ./images/virtualization_dark.png
    bg_mo_light: ./images/virtualization_mo.png
    bg_mo_dark: ./images/virtualization_mo_dark.png
    title: 虚拟化
    intro: 在虚拟机上运行 openEuler
    repeat: 1
    links:
      - href: /zh/wiki/install/virtualization/
        label: 在VirtualBox中安装openEuler
        introduce: Oracle VirtualBox是由InnoTek软件公司出品的虚拟机软件，现由Oracle进行开发，是Oracle公司xVM虚拟化平台技术的一部分。用户可以在openEuler官方软件仓下载openEuler的虚拟机镜像，使用VirtualBox安装openEuler虚拟机
  - id: raspberrypi
    bg_light: ./images/raspberry-pi.png
    bg_dark: ./images/raspberry-pi_dark.png
    bg_mo_light: ./images/raspberry-pi_mo.png
    bg_mo_dark: ./images/raspberry-pi_mo_dark.png
    title: 树莓派
    intro: 在树莓派上安装 openEuler
    repeat: 1
    links:
      - href: /zh/wiki/install/raspberry-pi/
        label: 在树莓派中安装openEuler
        introduce: 树莓派是一款由英国树莓派基金会开发的小型单板计算机，因其低成本、易于编程和灵活性而广受欢迎。用户可以在openEuler官方软件仓下载openEuler的树莓派镜像，在这款流行的硬件平台上体验openEuler操作系统

# get_resource: 相关资源（镜像仓 + 社区文档）
#   icon_light: 亮色主题图标（SVG，OCard :icon 组件消费，路径带 ?raw）
#   title: 资源标题
#   label: 资源描述
#   href: 资源链接
get_resource:
  - icon_light: ./images/mirror_light.svg?raw
    title: 镜像仓列表
    label: 查询openEuler所有镜像站点，欢迎新站点的加入
    href: /zh/mirror/list/
  - icon_light: ./images/docs_light.svg?raw
    title: openEuler社区文档
    label: 帮助开发者快速了解openEuler，包括发行说明、系统安装、管理员指南、虚拟化和容器等各类项目说明与使用指导
    href: https://docs.openeuler.org/zh/

# support_service: 支持与服务（FAQs + 社区论坛 + Quickissue）
#   icon_light: 亮色主题图标（SVG，OCard :icon 组件消费，路径带 ?raw）
#   title: 服务标题
#   label: 服务描述
#   href: 服务链接
support_service:
  - icon_light: ./images/faqs.svg?raw
    title: FAQs
    label: 查看openEuler常见问题
    href: /zh/faq/
  - icon_light: ./images/forum.svg?raw
    title: 社区论坛
    label: 与开发者讨论openEuler
    href: https://forum.openeuler.org/
  - icon_light: ./images/quickissue.svg?raw
    title: Quickissue
    label: 简易快捷地查询、提交社区Issues
    href: https://quickissue.openeuler.org/zh/issues/
