            - 'empire99200'
          img: './images/avatar/2026/wanglong.png'
          detail:
            - '近一年累计提交PR 1105个，持续高频参与openEuler社区代码贡献，社区活跃度表现突出。'

project:
  title:
    - 'openEuler 项目之星'
  list:
    - title: '年度优秀项目'
      bg: './images/project-card1.jpg'
      bg_dark: './images/project-card1-dark.jpg'
      list:
        - name: 'UBS-Engine'
          detail:
            - 'UBS-Engine（UB Service Core Engine）是 openEuler 社区开源的灵衢（UnifiedBus）超节点集群服务核心引擎，秉持“软件定义计算、按需资源组合与分配”理念，是 UB 计算系统的核心控制面参考实现。它面向内存、DPU 等资源实现池化与动态调度，支持分布式自动主节点选举与 N-1 高可靠，通过守护进程与配套 SDK 为开发者提供北向服务接口，助力上层应用充分释放超节点集群算力，繁荣灵衢软件生态。'
          link: 'https://atomgit.com/openeuler/ubs-engine'
        - name: 'openYuanrong'
          detail:
            - 'openYuanrong 数据系统是 openEuler 社区孵化的、以内存为中心、近计算的分布式异构多级缓存系统，也是 Serverless 分布式计算引擎 openYuanrong 的核心子系统。它利用集群 HBM/DRAM/SSD 资源构建多级缓存，以共享内存免拷贝读写、分布式对象引用、发布订阅等能力，为 AI 训推、智能体、大数据、微服务等分布式应用提供高性能的数据对象与数据流访问，并支持 NPU 卡间高效数据传输与分布式元数据水平扩展，兼顾高可用与数据可靠性。'
          link: 'https://atomgit.com/openeuler/yuanrong-datasystem'
        - name: 'Omni Operator'
          detail:
            - 'OmniOperator 是 openEuler 社区联合鲲鹏生态开源的大数据 SQL 算子加速引擎，是 OmniRuntime 大数据套件的核心特性之一。它以 Native Code（C/C++）实现高性能列式向量化算子，替换开源引擎的 Java/Scala 算子，并定义与语言无关的列式内存格式 OmniVec，实现零拷贝读取、无序列化开销的数据处理，充分释放鲲鹏等多样性算力。目前已适配 Spark 3.1.1–3.5.2、Hive、openLooKeng 及 Gluten 等主流引擎与框架，端到端提升大数据离线分析性能。'
          link: 'https://atomgit.com/openeuler/OmniOperator'
        - name: 'openEuler Kernel'
          detail:
            - 'openEuler Kernel 是 openEuler 操作系统的核心组件，是数字基础设施的关键底座。支持服务器、云、边缘、嵌入式等应用场景，支持多样性计算，致力于提供高性能、安全、稳定可靠的操作系统内核。'
          link: 'https://atomgit.com/openeuler/kernel'
        - name: '灵衢通信库UMDK'
          detail:
            - 'UMDK（Unified Memory Development Kit，灵衢内存语义开发包）是 openEuler 社区开源的、以内存语义为核心的分布式通信软件库，为数据中心网络、超节点内部及服务器卡间提供高性能通信接口，使能并充分发挥灵衢统一总线（UnifiedBus）的硬件能力。其核心组件 URMA 提供统一的单边、双边、原子等远端内存访问语义，并配套 URPC 高性能 RPC、ULOCK 分布式锁、USOCK 标准 Socket 兼容接口及面向训推通信加速的 CAM 库，支撑大数据、数据库、AI 训推等场景构建以内存语义互联为中心的新一代算力原生网络。'
          link: 'https://atomgit.com/openeuler/umdk'
    - title: '年度新建项目'
      bg: './images/project-card2.jpg'
      bg_dark: './images/project-card2-dark.jpg'
      list:
        - name: 'xiaoO'
          detail:
            - 'xiaoO 是 openEuler 社区开源的高效、安全的 AI Agent 框架，定位为 AgentOS 的智能中枢，提供面向系统管理、智能体编排、工具执行、记忆与上下文压缩、多渠道接入的自治 Agent 运行时。它将操作系统转变为智能体可稳定工作的环境，通过统一的 Agent Loop 协同文件、Shell、Git、Web 访问、技能与插件等能力，支撑智能系统管理与自动化工作流的快速构建。'
          link: 'https://atomgit.com/openeuler/xiaoO'
        - name: 'Agent Insight'
          detail:
            - 'Agent Insight 是 openEuler 社区孵化的开源 AgentOps 平台，致力于构建“观测—评测—诊断—优化”持续运转的能力闭环，让黑盒化的智能体成为可观测、可度量、可治理的可信资产。平台提供白盒链路追踪、多维评测、分钟级智能故障诊断与 Skill 闭环优化能力，基于 OpenTelemetry 等业界标准已适配 OpenCode、Claude Code 等多个主流 Agent 运行时，支持全栈本地化自托管部署。'
          link: 'https://atomgit.com/openeuler/agent-insight'
        - name: 'IB_Robot'
          detail:
            - 'IB_Robot 是 openEuler 社区基于 Intelligence BooM 开源全栈孵化的具身智能机器人软件全栈项目，也是 openEuler Embedded 26.03 首个开箱即用具身智能 OS 的核心底座。项目提供覆盖环境搭建、仿真调试、数据录制、一键部署的一站式工具链，支持 Sim2Real 无缝切换与微秒级实时控制，适配机械臂、四足机器狗、AGV 等多种物理形态，并深度融合 leRobot 与 ROS2 开源生态，支撑机器人研发创新与规模化商用落地。'
          link: 'https://atomgit.com/openeuler/IB_Robot'
        - name: 'witty-ub'
          detail:
            - 'witty-ub 是 openEuler Witty 智能运维体系中面向灵衢（UnifiedBus）超节点架构的故障定位工具，提供超节点可用性故障的信息采集与智能诊断能力。项目包含跨栈跨节点资源拓扑采集、多源日志采集与故障事件关联、基于大模型的故障诊断等组件，支撑超节点场景日志故障的定位定界，助力超节点 OS 从智能诊断迈向系统智能自治。'
          link: 'https://atomgit.com/openeuler/witty-ub'
        - name: 'KASandbox'
          detail:
            - 'KASandbox 是 openEuler 社区孵化的面向 AI 智能体的沙箱基础设施，为智能体提供安全隔离的云端代码执行与任务运行环境。项目支持微虚机隔离、快照与检查点回滚、CRI 多路复用及 Android 沙箱等能力，兼顾隔离强度与部署密度，为大规模智能体运行构筑可靠的执行基座。'
          link: 'https://atomgit.com/openeuler/KASandbox'
    - title: '金代码仓项目'
      bg: './images/project-card3.jpg'
      bg_dark: './images/project-card3-dark.jpg'
      list:
        - name: 'UBS-Comm'
          detail:
            - 'UBS Comm（UB Service Communication）是 openEuler 灵衢（UnifiedBus）超节点系统的高性能通信组件，面向高带宽、低延迟网络下的 C/S 架构应用提供统一的高级通信 API，屏蔽 RDMA、TCP、UDS、SHM 等底层协议的复杂性与差异性。它提供点对点单双边通信、双向 RPC、传输加密与故障检测重传等高可靠能力，使跨节点数据交换与数据一致性对应用透明，助力云、大数据、存储与 AI 训推场景性能提升。'
          link: 'https://atomgit.com/openeuler/ubs-comm'
        - name: 'witty-rag'
          detail:
            - 'witty-rag（euler-copilot-rag）是 EulerCopilot 智能操作系统助手的检索增强服务，并演进为社区自研、面向企业级运维场景的工业级 RAG 引擎底座，分层解耦、高可扩展、支持全链路自定义开发。项目打通文档解析、智能检索、质量评估、工程落地全链路，支持十余种主流文档格式与多路召回检索，为 EulerCopilot 智能问答、调优与诊断提供知识底座。'
          link: 'https://atomgit.com/openeuler/euler-copilot-rag'
        - name: 'yocto-meta-openeuler'
          detail:
            - 'yocto-meta-openeuler 是 openEuler Embedded 的核心构建仓，承载 openEuler 嵌入式版本镜像的构建与交付，在混合部署、嵌入式 AI、内核小型化、ROS、边缘容器等技术方向持续构建竞争力，积极引导 openEuler 嵌入式生态健康发展。（该项目同时荣获行业影响力项目奖项）'
          link: 'https://atomgit.com/openeuler/yocto-meta-openeuler'
    - title: '行业影响力项目'
      bg: './images/project-card5.jpg'
      bg_dark: './images/project-card5-dark.jpg'
      list:
        - name: 'openEuler-RISC-V'
          detail:
            - 'openEuler on RISC-V 项目为 openEuler 构建 RISC-V 软硬件生态，主导了 RVA20 版本构建、RVA23 版本计划、RVCK 内核同源计划等面向国内外 RISC-V 操作系统生态的核心项目，推动 openEuler 24.03 LTS 成为首批原生支持 RISC-V 架构的 Linux 发行版之一。'
          link: 'https://atomgit.com/openeuler/RISC-V'
        - name: 'yocto-meta-openeuler'
          detail:
            - 'yocto-meta-openeuler 是 openEuler Embedded 的核心构建仓，承载 openEuler 嵌入式版本镜像的构建与交付，在混合部署、嵌入式 AI、内核小型化、ROS、边缘容器等技术方向持续构建竞争力，积极引导 openEuler 嵌入式生态健康发展。（该项目同时荣获金代码仓项目奖项）'
          link: 'https://atomgit.com/openeuler/yocto-meta-openeuler'
        - name: 'StratoVirt'
          detail:
            - 'StratoVirt 是 openEuler 开源的轻量级虚拟化系统，以 Rust 语言实现，面向云数据中心提供企业级 VMM。它以一套架构统一支持虚拟机、容器、Serverless 三种场景，在轻量低噪、软硬协同、语言级安全等方面具备核心竞争优势，并预留组件化拼装接口，可按需组装高级特性直至支持标准虚拟化，为云原生负载提供高性能运行底座。'
          link: 'https://atomgit.com/openeuler/stratovirt'
    - title: '技术创新项目'
      bg: './images/project-card1.jpg'
      bg_dark: './images/project-card1-dark.jpg'
      list:
        - name: '异构融合虚拟化-xlite轻量化推理运行时'
          detail:
            - 'GVirt/Xlite 是 openEuler 异构融合 SIG 开源的轻量级 XPU 虚拟化前后端推理运行时，提供极简高效的异构运行环境，支持多样性算力协同。其中 Xlite 前端是轻量级大模型运行时，支持 DeepSeek-R1 等模型在昇腾等硬件上高效运行，算子基于昇腾 AscendC 开发，让大模型推理在异构算力上低门槛、高效率落地。'
          link: 'https://atomgit.com/openeuler/GVirt'
        - name: 'openEuler Compiler SIG Triton-CPU'
          detail:
            - 'Triton-CPU 是 openEuler 社区维护的 Triton 分支，为面向 GPU 的 Triton AI 编译框架构建 CPU 后端，并适配社区 LLVM 工具链。它基于 MLIR/LLVM 将 Triton 算子编译为 CPU 高性能代码，保持与 Triton 一致的编程接口，集成 FlagGems 高性能算子库，使深度学习原语与推理服务摆脱 GPU 依赖、在 CPU 平台高效运行，openEuler 24.03 LTS SP2 及以后版本可通过 yum 直接安装。'
          link: 'https://atomgit.com/openeuler/triton-cpu'
        - name: 'ubturbo'
          detail:
            - 'UBTurbo 是 openEuler UB（统一总线）生态中开源的节点内资源管理框架，具备配置读取、插件加载、日志打印与 IPC 通信等基础能力，并集成 SMAP 模块提供多级内存调度服务。其 RMRS（资源腾挪调度模块）负责虚拟机、容器内存资源的迁移调度，通过页面扫描与迁移实现分级内存，是超节点场景下内存资源灵活调度的关键组件。'
          link: 'https://atomgit.com/openeuler/ubturbo'
        - name: 'virtCCA机密计算高性能易部署底座'
          detail:
            - 'virtCCA 是包含 TEE 虚拟化的 ARM CCA 机密计算架构在 openEuler 上的落地底座，基于 QEMU、libvirt 与内核协同，在鲲鹏平台使能机密虚拟机与机密容器。它提供基于硬件的远程证明、密钥派生等能力，让应用在 TEE 内复用 REE 侧 openEuler 应用生态资源，实现机密计算应用易开发、易部署、易迁移，支撑数据安全与合规场景。'
          link: 'https://atomgit.com/openeuler/virtCCA_sdk'
    - title: '社区活跃项目'
      bg: './images/project-card2.jpg'
      bg_dark: './images/project-card2-dark.jpg'
      list:
        - name: 'mugen'
          detail:
            - 'mugen 是 openEuler 社区自主孵化的开源测试项目，面向操作系统质量保证人员提供统一的编程方法和架构设计能力，通过社区协同不断提升社区产品质量、测试能力及效率：提供持续丰富的操作系统测试用例，覆盖服务器、云计算、嵌入式等场景；提供高效的公共用例编写和执行方法库；支持解耦式执行及完善的测试过程跟踪与结果统计。'
          link: 'https://atomgit.com/openeuler/mugen'
        - name: 'dde_autotest_euler'
          detail:
            - 'dde_autotest_euler 是 openEuler 社区面向 DDE 桌面环境的自动化测试用例库，基于 YouQu 自动化测试框架构建。项目覆盖控制中心、任务栏、启动器、文件管理器等 DDE 核心组件，结合图像识别与 OCR 技术对桌面界面进行自动化操作与断言验证，持续沉淀桌面测试资产，保障 openEuler DDE 桌面的质量与稳定性。'
          link: 'https://atomgit.com/openeuler/dde_autotest_euler'
        - name: 'openEuler Release-management SIG'
          detail:
            - 'release-management 是 openEuler 社区版本发布管理的核心工具链与流程仓库，承载各版本的 release plan、关键特性清单、开发与分支计划及发布范围说明。Release Manager 团队依托该仓库协调各 SIG Maintainer、QA、发布工程与技术委员会，完成版本时间表规划、开发测试状态跟踪与发布评审决策，支撑社区版本高效、高质量持续交付。'
          link: 'https://atomgit.com/openeuler/release-management'

notice: '注：根据openEuler社区评奖规则，依据2026年1月1日 ~ 2026年10月20日的贡献进行评选，且展示不分先后顺序。'
