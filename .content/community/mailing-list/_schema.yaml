# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  subscription_process:
    label: 订阅流程步骤列表
    fields:
      title: 步骤标题
      detail: 步骤描述（含 HTML <a> 链接，用 v-dompurify-html 渲染）
      img: 步骤图片（PNG，<img>/OFigure 消费，不带 ?raw）
en:
  subscription_process:
    label: Subscription process steps
    fields:
      title: Step title
      detail: Step description (contains HTML <a> links, rendered via v-dompurify-html)
      img: Step image (PNG, <img>/OFigure consumption, no ?raw)
