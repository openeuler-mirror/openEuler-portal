# question: 如何成为 Organizer / Ambassador
question:
  title: 如何成为 openEuler 用户组Organizer、Ambassador？
  desc1: 如您想申请成为某城市组的 Organizer 或 Ambassador，请将满足以上贡献要求或其他类型深度社区贡献的说明和举证材料（如照片、截图、链接等）发送至邮箱
  desc2: 进行申请，社区运营工作组进行评审
  mail: user@openeuler.sh
  subtitle1: Organizer
  intro1: Organizer 是 openEuler 用户组的组织者和管理者，需要规划用户组发展、组织用户组活动。成为Organizer，需要是 openEuler 社区活跃的贡献者或用户，在所申请的城市有连接用户的资源，组织过至少一次 openEuler 相关的线下活动。
  subtitle2: Ambassador
  intro2: Ambassador 是 openEuler 用户组内传播大使的角色，需要帮助解答用户疑问，分享传播 openEuler 的技术和实践经验。成为Ambassador，需要积极参与 openEuler 社区贡献和传播，包括但不限于以下任一贡献：
  tip:
    - 在openEuler用户组社群、openEuler交流社群、openEuler论坛、邮件列表等交流渠道有效解答用户问题20次以上
    - 至少1次在公开的Meetup或峰会上分享openEuler相关议题
    - 在高校内讲openEuler相关课程
    - 在openEuler社区有代码贡献，提交过至少5个以上的PR并被社区合入

# guide: 详情页底部加入城市用户组引导
