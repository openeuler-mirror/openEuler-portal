      showcase:
        - summary: openEuler替代原有操作系统，大数据平台平滑迁移，文件读写性能平均提升20% ，业务稳定高效运行。
          path: zh/showcase/others/yaxin/
          img: /category/showcase/others.png
          article_name: index.md
          banner: /category/showcase/case-detail-bg.jpg
          text_content: 用户背景 亚信科技控股有限公司始于1993年，注册在北京，是中国领先的软件产品及相关服务提供商，致力成为5G时代大型企业数字化转型的使能者。 应用场景 亚信大数据基础平台产品，提供大数据领域的数据采集、存储，分析，处理，管控、运维能力，已用于电信、交通、政务、能源等行业，为各行业提供稳定、安全、高效的大数据技术底座。 业务挑战 大规模分布式Hadoop集群，约200个数据节点，数据量15PB,可用Vcore 1万个，需要平滑升级到openEuler操作系统，并保持数据分析业务的稳定运行。 解决方案 解决业务挑战的具体方案、技术创新、技术架构等，包含： 亚信大数据基础平台基于鲲鹏硬件（TaiShan 2280）适配改造，完成了产品的安装部署。 亚信大数据基础平台使用openEuler20.03适配改造，替代原有操作系统，完成产品升级。 毕昇JDK针对鲲鹏多核环境进行优化，为大数据基础平台提供更好的配置和性能优化支持。 升级过程中保持服务不中断，在线平滑升级后高效稳定运行。 为什么选择openEuler openEuler是一个开放、多元和架构包容的软件生态体系。 客户价值 大数据平台平滑迁移，业务稳定高效运行 与原有操作系统相比，文件读写性能平均提升20%， 满足数字化转型需求：帮助快速构建海量数据信息处理平台，优化运营效率。 未来规划 适配欧拉新版本，与操作系统厂家合作，使用一些新特性，提高产品的运行效率。 伙伴
