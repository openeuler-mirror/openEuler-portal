# Contribution page data
#
# Configuration data (image paths, links) extracted from i18n/contribution.
# Translation strings (LOOK_DESC/LOOK_MAP/PRINT_MAP) remain in i18n files.
# Images live in ./images/. PNGs do not use ?raw (<img> consumption).

# background_img: PC contribution map background (light/dark, en-differentiated)
background_img_light: ./images/contribution-map_light_en.png
background_img_dark: ./images/contribution-map_dark_en.png

# background_img_h5: Mobile contribution map background (light/dark, en-differentiated)
background_img_h5_light: ./images/contribution-map_light_en_mobile.png
background_img_h5_dark: ./images/contribution-map_dark_en_mobile.png

# download_pdf_url: Contribution map PDF download link
download_pdf_url: /category/contribution/openeuler-trail-chess-en.pdf

