# 组织架构数据 / Organization Structure (zh)
#
# 顶层对象，按委员会/工作组 slug 索引。
# 渲染顺序由 TheOrganization.vue 的 SECTIONS 数组决定（产品决策，写在视图代码里）。
# 图片路径以 ./ 开头，由 vite-plugin-content-yaml 重写为 import 走 Vite 资源管线。
# anchor 字段为页面 HTML 锚点 ID（zh/en 共用同一英文 anchor，显式写在 yaml 里）。
#
# 每个 section 形态三选一（互斥）：
#   - members: 平铺成员列表（最常见）
#   - groups:  子分组（按职位分组，如主席/常委/委员）
#   - rows:    分行渲染（数组的数组，每行是一组同级成员）
#
# 成员字段：
#   name:      姓名
#   image:     头像（相对当前 yaml 文件，./images/xxx.png）
#   position:  单位或职位（字符串或字符串数组）
#   post:      角色标签（主席/委员，技术委员会用这个）
#   email:     邮箱（可选，渲染成 mailto 图标）
#   gitee:     Gitee 账号（可选，渲染成 Gitee 图标）

