# Organization Structure (en)
#
# Top-level object indexed by committee/working-group slug.
# Render order is determined by TheOrganization.vue's SECTIONS array (product decision, in view code).
# Image paths start with ./ and are rewritten to imports by vite-plugin-content-yaml.
# anchor field is the page HTML anchor ID (shared by zh/en, explicitly written in yaml).
#
# Each section is one of three mutually-exclusive shapes:
#   - members: Flat member list (most common)
#   - groups:  Subgroups (e.g. Chairperson/Standing/Members)
#   - rows:    Multi-row render (array of arrays, each row is a peer group)
#
# Member fields:
#   name:      Name
#   image:     Avatar (relative to this yaml, ./images/xxx.png)
#   position:  Organization or role (string or string array)
#   post:      Role label (Chairperson/Member; used by Technical Committee)
#   email:     Email (optional, renders as mailto icon)
#   gitee:     Gitee account (optional, renders as Gitee icon)

