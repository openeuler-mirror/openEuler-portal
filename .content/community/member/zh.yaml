# 成员单位数据 / Community Members (zh)
#
# 顶层对象，按板块名索引。所有字段用基线名（无 _zh/_en 后缀）。
# 图片路径以 ./ 开头，由 vite-plugin-content-yaml 重写为 import 走 Vite 资源管线。

# donor_levels: 捐赠人级别列表（按级别从高到低）
#   id:          锚点 ID（中英文共用）
#   donor_title: 级别标题
#   logo_list:   logo 数组
#     img_light/img_dark: 亮/暗主题 logo（中英文共用）
#     alt:         图片 alt 文本（公司名，中英文共用）
#     no_icon:     是否隐藏角标（true=隐藏，不写=显示）
donor_levels:
  - id: Strategic-Donors
    donor_title: 战略捐赠人
    logo_list:
      - img_light: ./images/huawei_light.png
        img_dark: ./images/huawei_dark.png
        alt: 华为技术有限公司
        no_icon: true

