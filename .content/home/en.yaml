# Home page data
#
# Sections are ordered top-to-bottom by visual position on the page.
# Images live in ./images/. Shared zh/en images have no suffix; differentiated
# images keep their original _zh_/_en_ suffix; theme variants keep _light/_dark.
# SVGs consumed as inline icons (currentColor-aware) use ?raw; regular <img>/background SVGs do not.

# display_zone: Home quick links (four-card grid below banner)
#   title: Entry title
#   icon_light/icon_dark: Light/dark theme icons (SVG, <img>)
#   description: Entry description
#   link: Entry link
display_zone:
  - title: Technical White Papers
    icon_light: ./images/white-paper_light.svg
    icon_dark: ./images/white-paper_dark.svg
    description: Learn the tech details of each openEuler version.
    link: /en/showcase/technical-white-paper/
  - title: Security Center
    icon_light: ./images/security_light.svg
    icon_dark: ./images/security_dark.svg
    description: View security advisories and other security information.
    link: /en/security/security-bulletins/
  - title: SkillHub
    icon_light: ./images/skillhub.svg
    icon_dark: ./images/skillhub_dark.svg
    description: Explore, evaluate, and contribute openEuler skills.
    link: https://skillhub.openeuler.org
  - title: Events Center
    icon_light: ./images/event_light.svg
    icon_dark: ./images/event_dark.svg
    description: Stay updated on the latest openEuler events.
    link: /en/interaction/event-list/

# intro: openEuler intro trio (left list + right showcase image)
#   title: Intro title
#   img_pc/img_mo: PC/Mobile showcase images (en-differentiated, _en_ suffix)
#   icon_light/icon_dark: List icons (shared zh/en)
#   description: Intro description (same for zh/en)
intro:
  - title: Various Devices
    img_pc: ./images/computing-arch_en_pc.jpg
    img_mo: ./images/computing-arch_en_mo.png
    icon_light: ./images/computing-arch_light.png
    icon_dark: ./images/computing-arch_dark.png
    description: 全量组件原子化，构建服务自助化
  - title: All-Scenario Applications
    img_pc: ./images/cover-all_en_pc.jpg
    img_mo: ./images/cover-all_en_mo.png
    icon_light: ./images/cover-all_light.png
    icon_dark: ./images/cover-all_dark.png
    description: 一次开发，覆盖数字基础设施全场景
  - title: Development Tool Chain
    img_pc: ./images/development-tool_en_pc.jpg
    img_mo: ./images/development-tool_en_mo.png
    icon_light: ./images/development-tool_light.png
    icon_dark: ./images/development-tool_dark.png
    description: 统一API跨多设备调用

# play_community: Play-with-community cards (Contributor + Donor)
#   title: Card title
#   bg: Card background image (shared zh/en)
#   intro: Card intro
#   btn: Primary button {label, link}
#   textBtn: Secondary button {label, link} (optional)
play_community:
  - title: Start Contributing
    bg: ./images/card-1.png
    intro: Contribute code, modify docs, and join our discussions.
    btn:
      label: Contribution Guide
      link: /en/community/contribution/detail.html
    textBtn:
      label: View SIGs
      link: /en/sig/sig-list/
  - title: Become a Member
    bg: ./images/card-2.png
    intro: Welcome to openEuler! We're thrilled to have you as a member of our community dedicated to building an open source OS for digital infrastructure.
    btn:
      label: Members
      link: /en/community/member/

# vitality: Community vitality stats (actual values filled by API, vitalityValue is placeholder 0)
#   vitalityValue: Placeholder value (overwritten by API response)
#   vitalityKey: Key matching the API response field
#   vitalityLabel: Data item label
vitality:
  - vitalityValue: 0
    vitalityKey: contributors
    vitalityLabel: Contributors
  - vitalityValue: 0
    vitalityKey: repos
    vitalityLabel: Repositories
  - vitalityValue: 0
    vitalityKey: sigs
    vitalityLabel: SIGs
  - vitalityValue: 0
    vitalityKey: users
    vitalityLabel: Users
  - vitalityValue: 0
    vitalityKey: businessosv
    vitalityLabel: OS Vendors

# case: Showcase industry categories (tab switch + right illustration)
#   label: Industry name
#   icon: Industry icon (SVG, inline consumption, path uses ?raw)
#   img: Industry illustration (PNG, <OFigure>)
case:
  - label: Finance
    icon: ./images/finance.svg?raw
    img: ./images/finance.png
  - label: Carrier
    icon: ./images/operator.svg?raw
    img: ./images/operator.png
  - label: Energy
    icon: ./images/energy.svg?raw
    img: ./images/energy.png
  - label: Logistics
    icon: ./images/logistics.svg?raw
    img: ./images/logistics.png
  - label: Others
    icon: ./images/other.svg?raw
    img: ./images/other.png

