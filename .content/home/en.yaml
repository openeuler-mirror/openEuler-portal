# Home page data (en)
#
# Top-level object indexed by section name. All fields use baseline names (no _zh/_en suffix).
# Image paths start with ./ and are rewritten to imports by vite-plugin-content-yaml.

# banner: Home top banner
#   title:        Title (string or array for multi-line)
#   subtitle:     Subtitle (optional)
#   btn:          Button text (optional, omit for no button)
#   href:         Button link
#   bg_pc/bg_pad/bg_mb: PC/Tablet/Mobile background images
#   bg_theme:     light | dark, controls indicator color
#   text_theme:   dark=white text (optional)
#   is_blank:     Open in new window (optional)
#   attach:       Decorative attachment image (optional)
#   locale:       Visible language zh / en / zh,en (optional, default zh,en)
banner:
  - title:
      - OpenAtom openEuler
      - Annual Report 2025
    btn: View More
    href: /en/annual-report/openEuler-annual-report-2025/
    bg_pc: ./images/annual-report/pc.jpg
    bg_pad: ./images/annual-report/pad.jpg
    bg_mb: ./images/annual-report/mb_en.jpg
    bg_theme: light
    text_theme: dark
    is_blank: true

  - title: Get openEuler
    subtitle: Find all resources in one place
    btn: View More
    href: /en/download
    bg_pc: ./images/download/pc.jpg
    bg_pad: ./images/download/pad.jpg
    bg_mb: ./images/download/banner-mb-en.jpg
    bg_theme: light
    is_blank: true

# display_zone: Home quick links
#   title:          Entry title
#   icon_light/dark: Light/dark theme icons
#   description:    Entry description
#   link:           Entry link
display_zone:
  - title: Technical White Papers
    icon_light: ./images/display-zone/white-paper_light.svg
    icon_dark: ./images/display-zone/white-paper_dark.svg
    description: Learn the tech details of each openEuler version.
    link: /en/showcase/technical-white-paper/

  - title: Security Center
    icon_light: ./images/display-zone/security_light.svg
    icon_dark: ./images/display-zone/security_dark.svg
    description: View security advisories and other security information.
    link: /en/security/security-bulletins/

  - title: Migration Center
    icon_light: ./images/display-zone/migration_light.svg
    icon_dark: ./images/display-zone/migration_dark.svg
    description: Learn how to migrate to openEuler.
    link: /en/migration/

  - title: Events Center
    icon_light: ./images/display-zone/event_light.svg
    icon_dark: ./images/display-zone/event_dark.svg
    description: Stay updated on the latest openEuler events.
    link: /en/interaction/event-list/

# intro: Home intro cards
#   title:          Card title
#   img_pc/img_mo:  PC/Mobile images
#   icon_light/dark: Light/dark theme icons
#   description:    Description (only shown on zh page, kept here for structure parity)
intro:
  - title: Various Devices
    img_pc: ./images/intro/computing-arch_en_pc.jpg
    img_mo: ./images/intro/computing-arch_en_mo.png
    icon_light: ./images/intro/computing-arch_light.png
    icon_dark: ./images/intro/computing-arch_dark.png
    description: 全量组件原子化，构建服务自助化

  - title: All-Scenario Applications
    img_pc: ./images/intro/cover-all_en_pc.jpg
    img_mo: ./images/intro/cover-all_en_mo.png
    icon_light: ./images/intro/cover-all_light.png
    icon_dark: ./images/intro/cover-all_dark.png
    description: 一次开发，覆盖数字基础设施全场景

  - title: Development Tool Chain
    img_pc: ./images/intro/development-tool_en_pc.jpg
    img_mo: ./images/intro/development-tool_en_mo.png
    icon_light: ./images/intro/development-tool_light.png
    icon_dark: ./images/intro/development-tool_dark.png
    description: 统一API跨多设备调用

# play_community: Play community cards
#   title:    Card title
#   bg:       Card background image
#   intro:    Card intro
#   btn:      Primary button { label, link }
#   textBtn:  Text button { label, link } (optional)
play_community:
  - title: Start Contributing
    bg: ./images/play-community/card-1.png
    intro: Contribute code, modify docs, and join our discussions.
    btn:
      label: Contribution Guide
      link: /en/community/contribution/detail.html
    textBtn:
      label: View SIGs
      link: /zh/sig/sig-list/

  - title: Become a Member
    bg: ./images/play-community/card-2.png
    intro: Welcome to openEuler! We're thrilled to have you as a member of our community dedicated to building an open source OS for digital infrastructure.
    btn:
      label: Members
      link: /en/community/member/

