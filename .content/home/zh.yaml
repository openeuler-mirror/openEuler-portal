# 首页数据 / Home page data
#
# 板块按页面从上到下视觉顺序排列。
# 图片就近存放在 ./images/，zh/en 共用图不加后缀，差异化图保留原 _zh_/_en_ 后缀，主题变体保留 _light/_dark 后缀。
# SVG 作为 inline 图标（继承 currentColor）的路径带 ?raw，普通 <img>/背景图不带 ?raw。

# display_zone: 首页快捷入口配置（banner 下方四宫格）
#   title: 入口标题
#   icon_light/icon_dark: 亮色/暗色主题图标（SVG，<img> 消费）
#   description: 入口描述
#   link: 入口链接
display_zone:
  - title: 技术白皮书
    icon_light: ./images/white-paper_light.svg
    icon_dark: ./images/white-paper_dark.svg
    description: 了解openEuler各版本的技术详情
    link: /zh/showcase/technical-white-paper/
  - title: 安全中心
    icon_light: ./images/security_light.svg
    icon_dark: ./images/security_dark.svg
    description: 查看安全公告等安全问题
    link: /zh/security/security-bulletins/
  - title: 迁移专区
    icon_light: ./images/migration_light.svg
    icon_dark: ./images/migration_dark.svg
    description: 教你替换操作系统成openEuler
    link: /zh/migration/
  - title: 活动专区
    icon_light: ./images/event_light.svg
    icon_dark: ./images/event_dark.svg
    description: 了解openEuler最新活动
    link: /zh/interaction/event-list/

# intro: openEuler 介绍三步曲（左侧列表 + 右侧大图）
#   title: 介绍标题
#   img_pc/img_mo: PC/移动端展示图（zh 差异化，文件名含 _zh_ 后缀）
#   icon_light/icon_dark: 列表图标（zh/en 共用）
#   description: 介绍描述（zh/en 相同）
intro:
  - title: 支持多样性设备
    img_pc: ./images/computing-arch_zh_pc.jpg
    img_mo: ./images/computing-arch_zh_mo.png
    icon_light: ./images/computing-arch_light.png
    icon_dark: ./images/computing-arch_dark.png
    description: 全量组件原子化，构建服务自助化
  - title: 覆盖全场景应用
    img_pc: ./images/cover-all_zh_pc.jpg
    img_mo: ./images/cover-all_zh_mo.png
    icon_light: ./images/cover-all_light.png
    icon_dark: ./images/cover-all_dark.png
    description: 一次开发，覆盖数字基础设施全场景
  - title: 完整开发工具链
    img_pc: ./images/development-tool_zh_pc.jpg
    img_mo: ./images/development-tool_zh_mo.png
    icon_light: ./images/development-tool_light.png
    icon_dark: ./images/development-tool_dark.png
    description: 统一API跨多设备调用

# play_community: 玩转社区卡片（贡献者 + 捐赠人）
#   title: 卡片标题
#   bg: 卡片背景图（zh/en 共用）
#   intro: 卡片简介
#   btn: 主按钮 {label, link}
#   textBtn: 次按钮 {label, link}（可选）
play_community:
  - title: 成为社区贡献者
    bg: ./images/card-1.png
    intro: openEuler 欢迎大家以各种形式参与社区贡献，包括但不限于提交issue、参与讨论、代码贡献、文档捉虫等。一起加入openEuler参与贡献吧
    btn:
      label: 贡献攻略
      link: /zh/community/contribution/detail.html
    textBtn:
      label: 进入SIG中心
      link: /zh/sig/sig-list/
  - title: 成为项目群捐赠人
    bg: ./images/card-2.png
    intro: openEuler项目群，是由开放原子开源基金会孵化及运营的开源项目群。欢迎各企业参与共建，成为项目群成员。资金捐赠请联系 liyang@openatom.org
    btn:
      label: 成员单位
      link: /zh/community/member/
    textBtn:
      label: 查看捐赠权益
      link: /zh/community/charter/#第八条-项目群捐赠人的开源治理参与方式

# vitality: 社区活力数据（实际数值由 API 动态填充，此处 vitalityValue 为占位 0）
#   vitalityValue: 占位数值（API 返回后覆盖）
#   vitalityKey: 与 API 返回字段对应的键名
#   vitalityLabel: 数据项标签
vitality:
  - vitalityValue: 0
    vitalityKey: contributors
    vitalityLabel: 贡献者
  - vitalityValue: 0
    vitalityKey: repos
    vitalityLabel: 代码仓库
  - vitalityValue: 0
    vitalityKey: sigs
    vitalityLabel: 特别兴趣小组
  - vitalityValue: 0
    vitalityKey: users
    vitalityLabel: 社区用户
  - vitalityValue: 0
    vitalityKey: businessosv
    vitalityLabel: 商用OSV

# case: 案例展示行业分类（tab 切换 + 右侧插图）
#   label: 行业名称
#   icon: 行业图标（SVG，inline 消费，路径带 ?raw）
#   img: 行业插图（PNG，<OFigure> 消费）
case:
  - label: 金融
    icon: ./images/finance.svg?raw
    img: ./images/finance.png
  - label: 运营商
    icon: ./images/operator.svg?raw
    img: ./images/operator.png
  - label: 能源
    icon: ./images/energy.svg?raw
    img: ./images/energy.png
  - label: 物流
    icon: ./images/logistics.svg?raw
    img: ./images/logistics.png
  - label: 高校&科研
    icon: ./images/education.svg?raw
    img: ./images/education.png
  - label: 云计算
    icon: ./images/cloud-computing.svg?raw
    img: ./images/cloud-computing.png
  - label: 其他
    icon: ./images/other.svg?raw
    img: ./images/other.png

