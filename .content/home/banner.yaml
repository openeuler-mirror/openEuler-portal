# 首页轮播图 / Home Banner
#
# 字段说明：
#   bg_pc           PC 端背景图（中英文共用）
#   bg_pad          平板端背景图（中英文共用）
#   bg_mb           移动端背景图（中英文共用时不加后缀）
#   bg_mb_zh/en     移动端背景图（中英文不同时加后缀）
#   bg_theme        背景主题 light | dark，控制指示器颜色
#   text_theme      文字主题 dark=白色文字（可选）
#   title_zh/en     中英文标题（字符串或数组表示多行）
#   subtitle_zh/en  中英文副标题（可选）
#   btn_zh/en       中英文按钮文案（可选，不填则无按钮）
#   href_zh/en      中英文跳转链接
#   is_blank        是否新窗口打开（可选）
#   attach          附加装饰图（可选）
#   alt_zh/en       背景图 alt 文案（可选）：轮播项无 title/subtitle 时必填，取图片内展示的文字；有文案时 alt 置空
#   custom_class    定制样式类名（可选，作用于轮播项，样式定义在 HomeBanner.vue）
#   locale          可见语言 zh / en / zh,en（可选，默认 zh,en）
#   title_size      标题字号 large | small（可选，默认 large）
#   light/dark      主题变体块（可选）：亮色/暗色主题下覆盖任意基线字段（bg_pc/bg_mb/attach/bg_theme 等）；
#                   暗色下未定义 dark 块的轮播项回退基线字段，并对背景图加 img-in-dark 压暗滤镜

- bg_pc: ./images/summit/pc.jpg
  bg_pad: ./images/summit/pad.jpg
  bg_mb: ./images/summit/mb.jpg
  bg_theme: light
  attach: ./images/summit/text.png
  custom_class: summit
  alt_zh: "智启未来 引领 Agentic Infra 创新——Agentic Infra 操作系统大会 & openEuler Summit 2026，11月13日-14日，中国·北京中关村国际创新中心"
  alt_en: "Building Agentic Infra from the OS Up — Agentic Infra OS Conference & openEuler Summit 2026, November 13-14, 2026, Beijing, China"
  btn_zh: 查看详情
  btn_en: View More
  href_zh: /zh/interaction/summit-list/summit2026/
  href_en: /en/interaction/summit-list/summit2026/
  is_blank: true
  # 暗色主题整套资源：三端背景 + 文字图切换，指示器配色按深色背景适配
  dark:
    bg_pc: ./images/summit/pc-dark.jpg
    bg_pad: ./images/summit/pad-dark.jpg
    bg_mb: ./images/summit/mb-dark.jpg
    bg_theme: dark
    attach: ./images/summit/text-dark.png

