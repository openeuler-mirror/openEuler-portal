# 目录级内容元数据(编辑器白名单):键 = 文件名,值 = {section: {label, fields}}。
# fields 即编辑白名单(严格路径匹配,注册到叶子才可编辑)—— 摘除条目 = 隐藏;
# schema 缺失/路径不全的字段不可编辑,由业务在此补注册(而非编辑器宽容兜底)。
zh:
  status_map:
    label: 状态映射
    fields:
      key: 状态键名
      value: 状态值
      label: 状态标签
      tag: 状态描述
  reason:
    label: 修复原因筛选选项
    fields:
      value: 选项值
      label: 选项标签
  glossary:
    label: 术语表
    fields:
      status: 状态名称
      description: 状态描述
      list: 建议列表（可选，仅 "Will not fix" 有）
en:
  status_map:
    label: Status mapping
    fields:
      key: Status key name
      value: Status value
      label: Status label
      tag: Status description
  reason:
    label: Fix reason filter options
    fields:
      value: Option value
      label: Option label
  glossary:
    label: Glossary
    fields:
      status: Status name
      description: Status description
      list: Suggestion list (optional, only "Will not fix" has)
