# CVE page data
#
# status_map: Status mapping (converted from Map to array, rebuilt at consumption)
#   key: Status key name
#   value: Status value
#   label: Status label
#   tag: Status description
#
# reason: Fix reason filter options
#   value: Option value
#   label: Option label
#
# glossary: Glossary
#   status: Status name
#   description: Status description
#   list: Suggestion list (optional, only "Will not fix" has)

status_map:
  - key: all
    value: ''
    label: All
    tag: ''
  - key: Fixed
    value: Fixed
    label: Fixed
    tag: 'This vulnerability affects openEuler releases, and a fix has been released.'
  - key: Unaffected
    value: Unaffected
    label: Unaffected
    tag: 'This vulnerability does not affect openEuler releases and does not need to be fixed or updated.'
  - key: Affected
    value: Affected
    label: Affected
    tag: 'This vulnerability affects openEuler releases, and a fix is being prepared.'
  - key: Under Investigation
    value: Under Investigation
    label: Under Investigation
    tag: 'The openEuler security team is analyzing and evaluating the impact of this vulnerability on openEuler releases and has not yet confirmed if openEuler releases are affected.'

reason:
  - value: ''
    label: All
  - value: will fix
    label: Will fix
  - value: 'none_available-Vulnerabilities are still analyzing'
    label: Vulnerabilities are still analyzing
  - value: 'none_available-No solution or patch'
    label: No solution or patch
  - value: 'none_available-To be fixed through an upgraded version'
    label: To be fixed through upgraded
  - value: 'no_fix_planned-Out of support scope'
    label: Out of support scope
  - value: 'no_fix_planned-Will not fix'
    label: Will not fix
  - value: component_not_present
    label: Component not present
  - value: inline_mitigations_already_exist
    label: Inline mitigations already exist
  - value: vulnerable_code_cannot_be_controlled_by_adversary
    label: Vulnerable code cannot be controlled
  - value: vulnerable_code_not_in_execute_path
    label: Vulnerable code not in execute path
  - value: vulnerable_code_not_present
    label: Vulnerable code not present

glossary:
  - status: Fixed
    description: 'This vulnerability affects openEuler releases, and a fix has been released.'
  - status: Affected
    description: 'This vulnerability affects openEuler releases, and a fix is being prepared.'
  - status: Vulnerabilities are still analyzing
    description: 'A fix is being prepared.'
  - status: No solution or patch
    description: 'No fix or patch is available.'
  - status: To be fixed through an upgraded version
    description: 'A fix for this vulnerability will be included in a future version update.'
  - status: Out of support scope
    description: 'The packages or versions affected by this vulnerability are not within the support scope of openEuler. You are advised to adopt available mitigations or upgrade to supported packages or versions based on the impact scope evaluated by openEuler.'
  - status: Will not fix
    description: 'Although this vulnerability affects openEuler releases, the openEuler security team has decided not to fix it at this time after analysis and evaluation.\nSuggestions:'
    list:
      - 'Upgrade your OS to an openEuler release that includes a fix for this vulnerability or is not affected by it.'
      - 'If a mitigation is available for this vulnerability, consider applying it.'
      - 'Provide feedback to us outlining why a fix is necessary.'
  - status: Unaffected
    description: 'This vulnerability does not affect openEuler releases and does not need to be fixed or updated.'
  - status: Component_not_present
    description: 'openEuler releases do not include components affected by this vulnerability.'
  - status: Inline_mitigations_already_exist
    description: 'openEuler releases have incorporated control or mitigations.'
  - status: Vulnerable code cannot be controlled
    description: 'Attackers cannot successfully exploit the vulnerable code in openEuler releases.'
  - status: Vulnerable code not in execute path
    description: 'Vulnerable code in openEuler releases is not on the execution path.'
  - status: Vulnerable code not present
    description: 'openEuler releases do not contain the vulnerable code'
  - status: Under Investigation
    description: 'The openEuler security team is analyzing and evaluating the impact of this vulnerability on openEuler releases and has not yet confirmed if openEuler releases are affected.'
