first_tour_steps:
  - bg: ./images/tour/step-home.jpg
    target: ''
    color: ''
    placement: ''
    href: /
    title: Hi，朋友们，欢迎访问openEuler官网！
    desc:
      - openEuler是面向数字基础设施的开源操作系统。openEuler网站作为社区对外展示的重要窗口，一直致力于为开发者提供一个易于分享、交流、查询社区各类资源的平台，包括但不限于版本信息、软件包、工具、文档、活动、技术博客等
